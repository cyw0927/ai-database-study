<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">분석 전 데이터 품질 점검</title>
  <desc id="desc">행 수, NULL, 중복, 고아 외래키, 상태·날짜·금액 업무 규칙을 확인하고 이상이 없을 때 분석을 진행하며 문제가 있으면 원본과 JOIN을 수정하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="retryArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#0f172a}.title{font-size:29px;font-weight:800;text-anchor:middle}.sub{font-size:15px;text-anchor:middle;fill:#475569}.card{stroke-width:2;rx:14}.source{fill:#eff6ff;stroke:#3b82f6}.check{fill:#fffbeb;stroke:#f59e0b}.decision{fill:#fff7ed;stroke:#f97316;stroke-width:2.2}.ok{fill:#ecfdf5;stroke:#16a34a}.retrybox{fill:#fff1f2;stroke:#f43f5e}.head{font-size:16px;font-weight:700;text-anchor:middle}.body{font-size:12.5px;text-anchor:middle;fill:#334155}.line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.retry{stroke:#dc2626;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#retryArrow)}.tag{font-size:12px;font-weight:700;fill:#475569}.note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="600" y="48" class="title">분석 전 데이터 품질 점검</text>
  <text x="600" y="76" class="sub">집계 결과를 만들기 전에 원본 데이터와 JOIN 결과가 분석 기준을 만족하는지 확인합니다.</text>

  <rect x="35" y="175" width="155" height="115" class="card source"/>
  <text x="112.5" y="215" class="head">분석 대상 데이터</text>
  <text x="112.5" y="250" class="body">원본 테이블 · JOIN 결과</text>

  <rect x="225" y="175" width="125" height="115" class="card check"/>
  <text x="287.5" y="215" class="head">행 수</text>
  <text x="287.5" y="250" class="body">기대 8·3·5·24</text>

  <rect x="385" y="175" width="125" height="115" class="card check"/>
  <text x="447.5" y="215" class="head">NULL</text>
  <text x="447.5" y="250" class="body">업무 의미 확인</text>

  <rect x="545" y="175" width="125" height="115" class="card check"/>
  <text x="607.5" y="215" class="head">중복</text>
  <text x="607.5" y="250" class="body">PK·행 단위 확인</text>

  <rect x="705" y="175" width="125" height="115" class="card check"/>
  <text x="767.5" y="215" class="head">고아 FK</text>
  <text x="767.5" y="250" class="body">학생·강의 참조</text>

  <rect x="865" y="175" width="155" height="115" class="card check"/>
  <text x="942.5" y="215" class="head">업무 규칙</text>
  <text x="942.5" y="245" class="body">상태 · 완료일</text>
  <text x="942.5" y="268" class="body">결제금액</text>

  <polygon points="1100,160 1180,232.5 1100,305 1020,232.5" class="decision"/>
  <text x="1100" y="220" class="head">이상</text>
  <text x="1100" y="245" class="head">0건?</text>

  <path d="M190 232.5 H225" class="line"/>
  <path d="M350 232.5 H385" class="line"/>
  <path d="M510 232.5 H545" class="line"/>
  <path d="M670 232.5 H705" class="line"/>
  <path d="M830 232.5 H865" class="line"/>
  <path d="M1020 232.5 H1025" class="line"/>

  <rect x="830" y="405" width="250" height="95" class="card ok"/>
  <text x="955" y="442" class="head">예 · 분석 진행</text>
  <text x="955" y="474" class="body">SQL 집계와 분석 VIEW 생성</text>
  <path d="M1100 305 V360 H955 V405" class="line"/>
  <text x="1125" y="350" class="tag">예</text>

  <rect x="175" y="405" width="330" height="105" class="card retrybox"/>
  <text x="340" y="442" class="head">아니요 · 원인 확인</text>
  <text x="340" y="474" class="body">원본 · JOIN · 업무 규칙을 수정하고 재검사</text>
  <path d="M1100 305 V350 H550 V457.5 H505" class="retry"/>
  <text x="760" y="340" class="tag">아니요</text>
  <path d="M175 457.5 H90 V290" class="retry"/>

  <rect x="250" y="580" width="700" height="58" class="note"/>
  <text x="600" y="615" class="head">NULL과 중복을 임의로 제거하기 전에 왜 발생했는지 먼저 확인합니다.</text>
</svg>
