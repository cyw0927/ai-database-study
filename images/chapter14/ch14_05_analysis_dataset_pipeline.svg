<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">업무 테이블에서 분석용 데이터셋 만들기</title>
  <desc id="desc">학생, 수강신청, 강의, 강사 테이블을 외래키로 JOIN하고 파생 컬럼을 계산해 수강신청 1건 단위 VIEW를 만든 뒤 CSV 또는 PostgreSQL 연결로 pandas에 전달하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#0f172a}.mono{font-family:Consolas,D2Coding,"Courier New",monospace}.title{font-size:29px;font-weight:800;text-anchor:middle}.sub{font-size:15px;text-anchor:middle;fill:#475569}.card{stroke-width:2;rx:14}.source{fill:#eff6ff;stroke:#3b82f6}.join{fill:#f0fdf4;stroke:#22c55e}.dataset{fill:#ecfeff;stroke:#06b6d4}.branch{fill:#fffbeb;stroke:#f59e0b}.python{fill:#faf5ff;stroke:#8b5cf6}.head{font-size:16px;font-weight:700;text-anchor:middle}.body{font-size:12.5px;text-anchor:middle;fill:#334155}.small{font-size:11.5px;text-anchor:middle;fill:#475569}.line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.plain{stroke:#94a3b8;stroke-width:2;fill:none}.note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="48" class="title">업무 테이블에서 분석용 데이터셋 만들기</text>
  <text x="600" y="76" class="sub">원본 테이블을 복제하기보다 분석 행 단위를 명확히 한 VIEW를 사용합니다.</text>
  <rect x="45" y="135" width="210" height="78" class="card source"/><text x="150" y="168" class="head mono">students</text><text x="150" y="193" class="body">학생 · 지역</text>
  <rect x="45" y="235" width="210" height="78" class="card source"/><text x="150" y="268" class="head mono">enrollments</text><text x="150" y="293" class="body">신청일 · 상태 · 결제금액</text>
  <rect x="45" y="335" width="210" height="78" class="card source"/><text x="150" y="368" class="head mono">courses</text><text x="150" y="393" class="body">강의 · 범주 · 난이도</text>
  <rect x="45" y="435" width="210" height="78" class="card source"/><text x="150" y="468" class="head mono">instructors</text><text x="150" y="493" class="body">강사 · 전문 분야</text>
  <rect x="350" y="230" width="250" height="190" class="card join"/><text x="475" y="270" class="head">PK·FK 기준 JOIN</text><text x="475" y="310" class="body">student_id · course_id</text><text x="475" y="340" class="body">instructor_id</text><text x="475" y="378" class="head">파생 컬럼 계산</text><text x="475" y="404" class="small">월 · 완료 기간 · 완료 여부</text>
  <path d="M255 174 H300 V275 H350" class="line"/><path d="M255 274 H350" class="line"/><path d="M255 374 H300 V345 H350" class="line"/><path d="M255 474 H320 V390 H350" class="line"/>
  <rect x="680" y="210" width="300" height="230" class="card dataset"/><text x="830" y="252" class="head">분석용 VIEW</text><text x="830" y="284" class="head mono">enrollment_analysis_dataset</text><text x="830" y="326" class="body">수강신청 1건 = 1행</text><text x="830" y="358" class="body">enrollment_id 기준 중복 0</text><text x="830" y="390" class="body">기대 행 수 24</text><text x="830" y="420" class="small">원본 데이터 복제 없음</text><path d="M600 325 H680" class="line"/>
  <rect x="650" y="535" width="230" height="90" class="card branch"/><text x="765" y="570" class="head">CSV 내보내기</text><text x="765" y="600" class="body">DBeaver · UTF-8 · 헤더</text>
  <rect x="930" y="535" width="230" height="90" class="card branch"/><text x="1045" y="570" class="head">PostgreSQL 연결</text><text x="1045" y="600" class="body">SQLAlchemy · psycopg</text>
  <path d="M790 440 V490 H765 V535" class="line"/><path d="M870 440 V490 H1045 V535" class="line"/>
  <rect x="365" y="555" width="220" height="90" class="card python"/><text x="475" y="590" class="head">pandas DataFrame</text><text x="475" y="620" class="body">가공 · 분석 · 검증</text>
  <path d="M650 580 H585" class="line"/>
  <path d="M1045 625 V650 H475 V645" class="line"/>
  <rect x="280" y="665" width="640" height="40" class="note"/><text x="600" y="691" class="body">CSV와 DB 연결은 전달 방식만 다르며 같은 분석 데이터셋을 사용해야 합니다.</text>
</svg>
