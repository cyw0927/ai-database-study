<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">안전한 DELETE 실행 절차</title>
  <desc id="desc">DELETE 실행 전 같은 WHERE로 삭제 대상 행을 SELECT하고, 실행 후 다시 SELECT하여 삭제 결과와 남은 데이터를 확인하는 안전 절차</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>
    text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    .box{fill:#fff1f1;stroke:#d64545;stroke-width:2}.select{fill:#eef5ff;stroke:#3174d0;stroke-width:2}.decision{fill:#fffceb;stroke:#d6a600;stroke-width:2}.ok{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}.warn{fill:#fffceb;stroke:#d6a600;stroke-width:2}
    .name{font-size:18px;font-weight:700;text-anchor:middle}.sub{font-size:14px;text-anchor:middle;fill:#475569}.mono{font-size:14px;font-weight:700;text-anchor:middle;font-family:Consolas,D2Coding,"Courier New",monospace;fill:#0f2d5c}
    .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.loop{stroke:#d64545;stroke-width:2.3;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.label{font-size:16px;font-weight:700;text-anchor:middle}.note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
  </style></defs>
  <rect width="1200" height="760" fill="#fff"/><text x="600" y="48" class="title">안전한 DELETE 실행 절차</text>
  <rect x="405" y="82" width="390" height="70" rx="14" class="box"/><text x="600" y="110" class="name">1. 삭제 조건 작성</text><text x="600" y="135" class="mono">WHERE email = 'hyunwoo@example.com'</text>
  <path d="M600 152V192" class="line"/>
  <rect x="405" y="197" width="390" height="70" rx="14" class="select"/><text x="600" y="225" class="name">2. 같은 WHERE로 먼저 SELECT</text><text x="600" y="250" class="sub">삭제할 대상 행 확인</text>
  <path d="M600 267V307" class="line"/>
  <rect x="405" y="312" width="390" height="66" rx="14" class="decision"/><text x="600" y="340" class="name">의도한 행이 맞는가?</text><text x="600" y="363" class="sub">대상이 아니면 실행 중단</text>
  <rect x="115" y="312" width="230" height="66" rx="14" class="warn"/><text x="230" y="340" class="name">WHERE 수정</text><text x="230" y="363" class="sub">다시 SELECT</text>
  <path d="M405 345H345" class="loop"/><text x="375" y="331" class="label" fill="#b42323">아니요</text><path d="M230 312V232H405" class="loop"/>
  <path d="M600 378V425" class="line"/><text x="630" y="404" class="label" fill="#166534">예</text>
  <rect x="405" y="430" width="390" height="62" rx="14" class="box"/><text x="600" y="467" class="name">3. DELETE 실행</text>
  <path d="M600 492V530" class="line"/>
  <rect x="405" y="535" width="390" height="68" rx="14" class="select"/><text x="600" y="563" class="name">4. 다시 SELECT</text><text x="600" y="588" class="sub">대상 행이 삭제되었는지 확인</text>
  <path d="M600 603V635" class="line"/>
  <rect x="405" y="640" width="390" height="62" rx="14" class="ok"/><text x="600" y="665" class="name">전체 데이터도 확인</text><text x="600" y="688" class="sub">남아 있어야 할 행 유지</text>
  <rect x="830" y="430" width="260" height="78" rx="14" class="warn"/><text x="960" y="460" class="name">위험</text><text x="960" y="486" class="mono">DELETE FROM students;</text>
  <text x="600" y="744" class="note">WHERE 없는 DELETE는 모든 행을 삭제 대상에 포함하므로 더 신중하게 확인한다.</text>
</svg>
