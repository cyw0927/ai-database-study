<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">요구사항에서 데이터베이스 구조까지</title>
  <desc id="desc">요구사항을 읽고 엔터티, 속성, 관계, 키, ERD, PostgreSQL 구현을 거쳐 샘플 데이터와 JOIN으로 검증하는 반복 흐름</desc>
  <style>
      .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12.5px; }
      .card { stroke: #64748b; stroke-width: 1.6; rx: 14; ry: 14; }
      .entity { fill: #eaf3ff; }
      .attribute { fill: #ecf9ef; }
      .relation { fill: #f2ecff; }
      .decision { fill: #fff6d8; }
      .danger { fill: #ffeaea; }
      .ok { fill: #eaf8ee; }
      .pk { fill: #1d4ed8; font-weight: 700; }
      .fk { fill: #c2410c; font-weight: 700; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <text x="600.0" y="42" text-anchor="middle" class="ko title"><tspan x="600.0" dy="0">요구사항에서 데이터베이스 구조까지</tspan></text>
  <text x="600.0" y="70" text-anchor="middle" class="ko subtitle"><tspan x="600.0" dy="0">설계는 요구사항에서 시작하고 실제 데이터 검증으로 확인합니다.</tspan></text>
  <rect x="70" y="120" width="180" height="92" rx="14" ry="14" class="card decision"/><text x="160" y="173" text-anchor="middle" class="ko box-title"><tspan x="160" dy="0">요구사항 읽기</tspan></text>
  <rect x="310" y="120" width="180" height="92" rx="14" ry="14" class="card entity"/><text x="400" y="173" text-anchor="middle" class="ko box-title"><tspan x="400" dy="0">엔터티 후보 찾기</tspan></text>
  <rect x="550" y="120" width="180" height="92" rx="14" ry="14" class="card attribute"/><text x="640" y="173" text-anchor="middle" class="ko box-title"><tspan x="640" dy="0">속성 정리</tspan></text>
  <rect x="790" y="120" width="220" height="92" rx="14" ry="14" class="card relation"/><text x="900" y="173" text-anchor="middle" class="ko box-title"><tspan x="900" dy="0">관계 찾기</tspan></text>
  <rect x="1020" y="120" width="170" height="92" rx="14" ry="14" class="card relation"/><text x="1105" y="173" text-anchor="middle" class="ko box-title"><tspan x="1105" dy="0">PK·FK 결정</tspan></text>
  <rect x="190" y="300" width="180" height="92" rx="14" ry="14" class="card entity"/><text x="280" y="353" text-anchor="middle" class="ko box-title"><tspan x="280" dy="0">ERD 작성</tspan></text>
  <rect x="470" y="300" width="220" height="92" rx="14" ry="14" class="card attribute"/><text x="580" y="353" text-anchor="middle" class="ko box-title"><tspan x="580" dy="0">PostgreSQL 테이블 생성</tspan></text>
  <rect x="790" y="300" width="220" height="92" rx="14" ry="14" class="card attribute"/><text x="900" y="353" text-anchor="middle" class="ko box-title"><tspan x="900" dy="0">샘플 데이터·JOIN 검증</tspan></text>
  <line x1="250" y1="166" x2="310" y2="166" class="line" marker-end="url(#arrow)"/><line x1="490" y1="166" x2="550" y2="166" class="line" marker-end="url(#arrow)"/><line x1="730" y1="166" x2="790" y2="166" class="line" marker-end="url(#arrow)"/><line x1="1010" y1="166" x2="1020" y2="166" class="line" marker-end="url(#arrow)"/>
  <path d="M 1105 212 C 1105 260, 280 250, 280 300" class="line" marker-end="url(#arrow)"/><line x1="370" y1="346" x2="470" y2="346" class="line" marker-end="url(#arrow)"/><line x1="690" y1="346" x2="790" y2="346" class="line" marker-end="url(#arrow)"/>
  <rect x="430" y="470" width="340" height="100" rx="14" ry="14" class="card decision"/><text x="600" y="510" text-anchor="middle" class="ko box-title"><tspan x="600" dy="0">요구사항을 올바르게</tspan><tspan x="600" dy="24">표현하는가?</tspan></text>
  <line x1="900" y1="392" x2="700" y2="470" class="line" marker-end="url(#arrow)"/><text x="740" y="442" text-anchor="middle" class="ko small"><tspan x="740" dy="0">검증</tspan></text>
  <rect x="900" y="490" width="210" height="80" rx="14" ry="14" class="card ok"/><text x="1005" y="538" text-anchor="middle" class="ko box-title"><tspan x="1005" dy="0">예 → 설계 초안 채택</tspan></text><line x1="770" y1="520" x2="900" y2="530" class="line" marker-end="url(#arrow)"/>
  <path d="M 430 520 C 250 520, 180 450, 180 392" class="dash" marker-end="url(#arrow)"/><text x="285" y="495" text-anchor="middle" class="ko small"><tspan x="285" dy="0">아니요 → 엔터티·속성·관계 재검토</tspan></text>
</svg>