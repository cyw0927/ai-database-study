<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">도서 대여 시스템 핵심 ERD</title>
  <desc id="desc">members, loans, books의 주요 열과 키를 보여 주며, 회원과 도서는 각각 0개 이상의 대여 기록을 가질 수 있고 각 loans 행은 회원 한 명과 도서 한 건을 반드시 참조한다. email과 isbn은 고유성 정책이 아직 확정되지 않은 후보이다.</desc>
  <style>
    text {font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#1f2937}
    .code {font-family:Consolas,D2Coding,"Noto Sans Mono CJK KR",Menlo,monospace}
    .title {font-size:32px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    .subtitle {font-size:15px;text-anchor:middle;fill:#4b5563}
    .card {stroke:#64748b;stroke-width:2;rx:14}
    .entity {fill:#eaf3ff}
    .event {fill:#f3edff;stroke:#7c63c7}
    .table-name {font-size:20px;font-weight:700;text-anchor:middle;fill:#172033}
    .role {font-size:15px;text-anchor:middle;fill:#4b5563}
    .row-line {stroke:#cbd5e1;stroke-width:1.3}
    .field {font-size:16px;fill:#111827}
    .ref {font-size:14px;fill:#475569}
    .badge {stroke-width:1.2;rx:7}
    .pk {fill:#dbeafe;stroke:#2563eb}
    .fk {fill:#ffedd5;stroke:#ea580c}
    .candidate {fill:#fef3c7;stroke:#d97706}
    .nullable {fill:#f1f5f9;stroke:#94a3b8}
    .badge-text {font-size:14px;font-weight:700;text-anchor:middle;fill:#172033}
    .relationship {stroke:#475569;stroke-width:3;fill:none}
    .cardinality {font-size:20px;font-weight:700;text-anchor:middle;fill:#172033}
    .caption-card {fill:#fff7df;stroke:#d6a600;stroke-width:2;rx:12}
    .caption {font-size:18px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    .caption-small {font-size:15px;text-anchor:middle;fill:#334155}
  </style>
  <rect width="1200" height="880" fill="#ffffff"/>
  <text x="600" y="50" class="title">도서 대여 시스템 핵심 ERD</text>
  <text x="600" y="82" class="subtitle">요구사항에서 도출한 테이블·열·관계를 한눈에 확인합니다.</text>

  <g transform="translate(50 150)">
    <rect width="300" height="410" class="card entity"/>
    <text x="150" y="48" class="table-name code">members</text>
    <text x="150" y="80" class="role">회원 테이블</text>
    <line x1="24" y1="106" x2="276" y2="106" class="row-line"/>
    <g transform="translate(24 124)">
      <rect width="56" height="30" class="badge pk"/>
      <text x="28" y="21" class="badge-text">PK</text>
      <text x="76" y="22" class="field code">id</text>
    </g>
    <line x1="24" y1="168" x2="276" y2="168" class="row-line"/>
    <text x="100" y="205" class="field code">name</text>
    <line x1="24" y1="230" x2="276" y2="230" class="row-line"/>
    <g transform="translate(24 248)">
      <rect width="92" height="30" class="badge candidate"/>
      <text x="46" y="21" class="badge-text">고유 후보</text>
      <text x="112" y="22" class="field code">email</text>
    </g>
    <line x1="24" y1="292" x2="276" y2="292" class="row-line"/>
    <text x="100" y="329" class="field code">joined_at</text>
  </g>

  <g transform="translate(415 108)">
    <rect width="370" height="555" class="card event"/>
    <text x="185" y="48" class="table-name code">loans</text>
    <text x="185" y="80" class="role">대여 사건·업무 테이블</text>
    <text x="185" y="106" class="role">한 행 = 회원 1명과 도서 1건의 대여</text>
    <line x1="24" y1="134" x2="346" y2="134" class="row-line"/>
    <g transform="translate(24 152)">
      <rect width="56" height="30" class="badge pk"/>
      <text x="28" y="21" class="badge-text">PK</text>
      <text x="76" y="22" class="field code">id</text>
    </g>
    <line x1="24" y1="198" x2="346" y2="198" class="row-line"/>
    <g transform="translate(24 216)">
      <rect width="86" height="30" class="badge fk"/>
      <text x="43" y="21" class="badge-text">FK·필수</text>
      <text x="104" y="22" class="field code">member_id</text>
      <text x="104" y="48" class="ref code">→ members.id</text>
    </g>
    <line x1="24" y1="286" x2="346" y2="286" class="row-line"/>
    <g transform="translate(24 304)">
      <rect width="86" height="30" class="badge fk"/>
      <text x="43" y="21" class="badge-text">FK·필수</text>
      <text x="104" y="22" class="field code">book_id</text>
      <text x="104" y="48" class="ref code">→ books.id</text>
    </g>
    <line x1="24" y1="374" x2="346" y2="374" class="row-line"/>
    <text x="128" y="411" class="field code">borrowed_at</text>
    <line x1="24" y1="438" x2="346" y2="438" class="row-line"/>
    <text x="128" y="475" class="field code">due_at</text>
    <line x1="24" y1="502" x2="346" y2="502" class="row-line"/>
    <g transform="translate(200 520)">
      <rect width="72" height="30" class="badge nullable"/>
      <text x="36" y="21" class="badge-text">선택</text>
      <text x="-142" y="22" class="field code">returned_at</text>
      <text x="82" y="22" class="ref">NULL 허용</text>
    </g>
  </g>

  <g transform="translate(850 150)">
    <rect width="300" height="410" class="card entity"/>
    <text x="150" y="48" class="table-name code">books</text>
    <text x="150" y="80" class="role">도서 테이블</text>
    <line x1="24" y1="106" x2="276" y2="106" class="row-line"/>
    <g transform="translate(24 124)">
      <rect width="56" height="30" class="badge pk"/>
      <text x="28" y="21" class="badge-text">PK</text>
      <text x="76" y="22" class="field code">id</text>
    </g>
    <line x1="24" y1="168" x2="276" y2="168" class="row-line"/>
    <text x="100" y="205" class="field code">title</text>
    <line x1="24" y1="230" x2="276" y2="230" class="row-line"/>
    <text x="100" y="267" class="field code">author</text>
    <line x1="24" y1="292" x2="276" y2="292" class="row-line"/>
    <g transform="translate(24 310)">
      <rect width="72" height="30" class="badge nullable"/>
      <text x="36" y="21" class="badge-text">선택</text>
      <text x="92" y="22" class="field code">published_year</text>
    </g>
    <line x1="24" y1="354" x2="276" y2="354" class="row-line"/>
    <g transform="translate(24 372)">
      <rect width="92" height="30" class="badge candidate"/>
      <text x="46" y="21" class="badge-text">고유 후보</text>
      <text x="112" y="22" class="field code">isbn</text>
    </g>
  </g>

  <g>
    <line x1="350" y1="372" x2="415" y2="372" class="relationship"/>
    <text x="371" y="346" class="cardinality">1</text>
    <text x="395" y="407" class="cardinality">0..N</text>
    <line x1="785" y1="372" x2="850" y2="372" class="relationship"/>
    <text x="805" y="407" class="cardinality">0..N</text>
    <text x="830" y="346" class="cardinality">1</text>
  </g>

  <g>
    <rect x="76" y="710" width="510" height="84" class="caption-card"/>
    <text x="331" y="743" class="caption">회원과 대여 기록</text>
    <text x="331" y="772" class="caption-small">한 회원은 대여 기록이 없거나 여러 개일 수 있다.</text>
    <rect x="614" y="710" width="510" height="84" class="caption-card"/>
    <text x="869" y="743" class="caption">도서와 대여 기록</text>
    <text x="869" y="772" class="caption-small">한 도서도 대여 기록이 없거나 여러 개일 수 있다.</text>
    <text x="600" y="842" class="caption">email과 isbn의 고유성은 후보이며, 정책 확인 전에는 UNIQUE를 적용하지 않습니다.</text>
  </g>
</svg>