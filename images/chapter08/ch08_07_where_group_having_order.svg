<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" viewBox="0 0 1200 660">
  <title id="title">집계 쿼리의 논리적 처리 흐름</title>
  <desc id="desc">FROM과 JOIN 이후 WHERE, GROUP BY와 집계, HAVING, SELECT, ORDER BY가 이어지는 학습용 논리적 처리 흐름을 보여 주는 도식이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .box { stroke: #334155; stroke-width: 2; rx: 16; ry: 16; }
      .head { font: 600 17px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .text { font: 14px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">집계 쿼리의 논리적 처리 흐름</text>
  <rect x="430" y="90" width="340" height="78" class="box" fill="#dbeafe"/>
  <text x="600" y="120" text-anchor="middle" class="head">FROM / JOIN</text>
  <text x="600" y="148" text-anchor="middle" class="text">데이터 원본과 관계 연결</text>
  <rect x="430" y="210" width="340" height="88" class="box" fill="#fef3c7"/>
  <text x="600" y="242" text-anchor="middle" class="head">WHERE</text>
  <text x="600" y="270" text-anchor="middle" class="text">그룹화 전에 개별 행 필터링</text>
  <text x="600" y="290" text-anchor="middle" class="text">예: status = '수강중'</text>
  <rect x="430" y="340" width="340" height="88" class="box" fill="#ffedd5"/>
  <text x="600" y="372" text-anchor="middle" class="head">GROUP BY + 집계 계산</text>
  <text x="600" y="400" text-anchor="middle" class="text">행을 그룹으로 묶고 COUNT · SUM · AVG 계산</text>
  <rect x="430" y="470" width="340" height="88" class="box" fill="#fef3c7"/>
  <text x="600" y="502" text-anchor="middle" class="head">HAVING</text>
  <text x="600" y="530" text-anchor="middle" class="text">집계 결과를 기준으로 그룹 필터링</text>
  <text x="600" y="550" text-anchor="middle" class="text">예: COUNT(e.id) &gt;= 2</text>
  <rect x="830" y="235" width="250" height="78" class="box" fill="#dcfce7"/>
  <text x="955" y="265" text-anchor="middle" class="head">SELECT</text>
  <text x="955" y="293" text-anchor="middle" class="text">출력 컬럼과 집계 결과 구성</text>
  <rect x="830" y="365" width="250" height="78" class="box" fill="#dcfce7"/>
  <text x="955" y="395" text-anchor="middle" class="head">ORDER BY</text>
  <text x="955" y="423" text-anchor="middle" class="text">최종 결과 정렬</text>
  <line x1="600" y1="168" x2="600" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="298" x2="600" y2="340" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="428" x2="600" y2="470" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="255" x2="830" y2="274" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="515" x2="830" y2="404" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="120" y="590" width="960" height="45" class="box" fill="#f8fafc"/>
  <text x="600" y="618" text-anchor="middle" class="text">이 순서는 초급 학습을 위한 논리적 처리 흐름이며, SQL 문법 순서나 물리적 실행 계획과 완전히 같다고 단정하지 않는다</text>
</svg>
