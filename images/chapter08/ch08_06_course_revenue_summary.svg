<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" viewBox="0 0 1200 620">
  <title id="title">강의별 신청 건수와 기록 금액 집계</title>
  <desc id="desc">모든 courses 행을 유지한 상태로 LEFT JOIN과 그룹화를 거쳐 수강신청 건수, 고유 학생 수, 기록 금액 합계를 구하는 과정을 보여 주는 도식이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .box { stroke: #334155; stroke-width: 2; rx: 16; ry: 16; }
      .head { font: 600 17px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .text { font: 14px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .code { font: 13px Consolas,D2Coding,'Courier New',monospace; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">강의별 신청 건수와 기록 금액 집계</text>
  <rect x="90" y="145" width="220" height="110" class="box" fill="#dbeafe"/>
  <text x="200" y="180" text-anchor="middle" class="head">courses</text>
  <text x="200" y="212" text-anchor="middle" class="text">모든 강의 유지</text>
  <rect x="390" y="145" width="240" height="110" class="box" fill="#ede9fe"/>
  <text x="510" y="180" text-anchor="middle" class="head">LEFT JOIN enrollments</text>
  <text x="510" y="212" text-anchor="middle" class="text">수강신청이 없어도 강의는 남는다</text>
  <rect x="710" y="110" width="400" height="180" class="box" fill="#ffedd5"/>
  <text x="910" y="145" text-anchor="middle" class="head">강의별 그룹과 계산</text>
  <text x="910" y="180" text-anchor="middle" class="code">COUNT(e.id) = 수강신청 건수</text>
  <text x="910" y="215" text-anchor="middle" class="code">COUNT(DISTINCT e.student_id) = 고유 학생 수</text>
  <text x="910" y="250" text-anchor="middle" class="code">COALESCE(SUM(e.recorded_amount), 0) = 기록 금액 합계</text>
  <line x1="310" y1="200" x2="390" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="200" x2="710" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="270" y="360" width="660" height="120" class="box" fill="#dcfce7"/>
  <text x="600" y="395" text-anchor="middle" class="head">수강신청이 없는 강의: 집계 쿼리 실습</text>
  <text x="600" y="428" text-anchor="middle" class="text">수강신청 건수 0 · 고유 학생 수 0 · 기록 금액 합계 0</text>
  <rect x="230" y="515" width="740" height="60" class="box" fill="#fef2f2"/>
  <text x="600" y="550" text-anchor="middle" class="text">기록 금액 합계는 저장된 값의 합계이며, 환불·취소 정책을 반영한 최종 회계 매출과는 다를 수 있다</text>
</svg>
