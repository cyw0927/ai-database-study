<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">NoSQL 유형 비교</title>
  <desc id="desc">Key-Value, Document, Column-Family, Graph 데이터베이스를 데이터 모델, 주요 접근 방식, 온라인 강의 서비스 예시와 설계 주의점으로 비교하는 4열 도식</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Arial,sans-serif;fill:#0f172a}
      .mono{font-family:Consolas,D2Coding,"Courier New",monospace}
      .title{font-size:30px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:14px;text-anchor:middle;fill:#475569}
      .head{font-size:19px;font-weight:800;text-anchor:middle}
      .section{font-size:14px;font-weight:700;text-anchor:middle}
      .body{font-size:13px;text-anchor:middle;fill:#334155}
      .small{font-size:11.8px;text-anchor:middle;fill:#475569}
      .card{stroke-width:2;rx:18;ry:18}
      .principle{fill:#f8fafc;stroke:#94a3b8}
      .kv{fill:#eff6ff;stroke:#3b82f6}
      .doc{fill:#f0fdf4;stroke:#22c55e}
      .column{fill:#fffbeb;stroke:#f59e0b}
      .graph{fill:#ecfeff;stroke:#06b6d4}
      .row{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3;rx:12;ry:12}
      .note{fill:#faf5ff;stroke:#8b5cf6}
      .divider{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:6 6}
      .blue{fill:#1d4ed8}.green{fill:#15803d}.orange{fill:#b45309}.cyan{fill:#0e7490}
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="46" class="title">NoSQL 유형 비교</text>
  <text x="600" y="74" class="subtitle">NoSQL은 하나의 데이터베이스가 아니라 서로 다른 접근 패턴을 위한 저장 모델 계열입니다.</text>

  <rect x="100" y="100" width="1000" height="66" class="card principle"/>
  <text x="600" y="126" class="section">비교 원칙</text>
  <text x="600" y="150" class="body">저장 형식이 아니라 가장 중요한 읽기·쓰기 질문, 일관성 범위와 운영 책임을 기준으로 선택합니다.</text>

  <!-- Key-Value -->
  <rect x="35" y="205" width="270" height="500" class="card kv"/>
  <text x="170" y="240" class="head blue">Key-Value DB</text>
  <text x="170" y="265" class="small">정확한 키와 만료가 중심</text>
  <line x1="60" y1="285" x2="280" y2="285" class="divider"/>

  <rect x="60" y="305" width="220" height="72" class="row"/>
  <text x="170" y="331" class="section">데이터 모델</text>
  <text x="170" y="357" class="mono body">key → value</text>

  <rect x="60" y="392" width="220" height="88" class="row"/>
  <text x="170" y="419" class="section">주요 접근 방식</text>
  <text x="170" y="445" class="body">정확한 키 조회</text>
  <text x="170" y="467" class="small">TTL·만료·빠른 읽기</text>

  <rect x="60" y="495" width="220" height="88" class="row"/>
  <text x="170" y="522" class="section">온라인 강의 예</text>
  <text x="170" y="548" class="body">로그인 세션</text>
  <text x="170" y="570" class="body">인기 강의 캐시</text>

  <rect x="60" y="598" width="220" height="82" class="row"/>
  <text x="170" y="625" class="section">설계 주의점</text>
  <text x="170" y="651" class="body">범위·관계 질의에는</text>
  <text x="170" y="673" class="body">맞지 않을 수 있음</text>

  <!-- Document -->
  <rect x="325" y="205" width="270" height="500" class="card doc"/>
  <text x="460" y="240" class="head green">Document DB</text>
  <text x="460" y="265" class="small">문서 단위 구조와 조회</text>
  <line x1="350" y1="285" x2="570" y2="285" class="divider"/>

  <rect x="350" y="305" width="220" height="72" class="row"/>
  <text x="460" y="331" class="section">데이터 모델</text>
  <text x="460" y="357" class="body">독립 문서·중첩 필드</text>

  <rect x="350" y="392" width="220" height="88" class="row"/>
  <text x="460" y="419" class="section">주요 접근 방식</text>
  <text x="460" y="445" class="body">문서 ID·필드 조건</text>
  <text x="460" y="467" class="small">문서 단위 읽기·쓰기</text>

  <rect x="350" y="495" width="220" height="88" class="row"/>
  <text x="460" y="522" class="section">온라인 강의 예</text>
  <text x="460" y="548" class="body">강의 메타데이터</text>
  <text x="460" y="570" class="body">강의 옵션·설정</text>

  <rect x="350" y="598" width="220" height="82" class="row"/>
  <text x="460" y="625" class="section">설계 주의점</text>
  <text x="460" y="651" class="body">스키마 규칙과 중복을</text>
  <text x="460" y="673" class="body">애플리케이션에서도 관리</text>

  <!-- Column-Family -->
  <rect x="615" y="205" width="270" height="500" class="card column"/>
  <text x="750" y="240" class="head orange">Column-Family DB</text>
  <text x="750" y="265" class="small">파티션과 정렬 키 중심</text>
  <line x1="640" y1="285" x2="860" y2="285" class="divider"/>

  <rect x="640" y="305" width="220" height="72" class="row"/>
  <text x="750" y="331" class="section">데이터 모델</text>
  <text x="750" y="357" class="body">파티션 키·정렬 키</text>

  <rect x="640" y="392" width="220" height="88" class="row"/>
  <text x="750" y="419" class="section">주요 접근 방식</text>
  <text x="750" y="445" class="body">특정 파티션의 범위 조회</text>
  <text x="750" y="467" class="small">시간순·대량 이벤트 읽기</text>

  <rect x="640" y="495" width="220" height="88" class="row"/>
  <text x="750" y="522" class="section">온라인 강의 예</text>
  <text x="750" y="548" class="body">학생별·날짜별</text>
  <text x="750" y="570" class="body">학습 행동 이벤트</text>

  <rect x="640" y="598" width="220" height="82" class="row"/>
  <text x="750" y="625" class="section">설계 주의점</text>
  <text x="750" y="651" class="body">파티션 키·핫스팟과</text>
  <text x="750" y="673" class="body">조회 경로를 먼저 설계</text>

  <!-- Graph -->
  <rect x="905" y="205" width="260" height="500" class="card graph"/>
  <text x="1035" y="240" class="head cyan">Graph DB</text>
  <text x="1035" y="265" class="small">노드와 관계 탐색 중심</text>
  <line x1="930" y1="285" x2="1140" y2="285" class="divider"/>

  <rect x="930" y="305" width="210" height="72" class="row"/>
  <text x="1035" y="331" class="section">데이터 모델</text>
  <text x="1035" y="357" class="body">노드·관계·속성</text>

  <rect x="930" y="392" width="210" height="88" class="row"/>
  <text x="1035" y="419" class="section">주요 접근 방식</text>
  <text x="1035" y="445" class="body">다단계 관계 탐색</text>
  <text x="1035" y="467" class="small">경로·연결 패턴 조회</text>

  <rect x="930" y="495" width="210" height="88" class="row"/>
  <text x="1035" y="522" class="section">온라인 강의 예</text>
  <text x="1035" y="548" class="body">학생·강의·주제</text>
  <text x="1035" y="570" class="body">추천 관계 탐색</text>

  <rect x="930" y="598" width="210" height="82" class="row"/>
  <text x="1035" y="625" class="section">설계 주의점</text>
  <text x="1035" y="651" class="body">일반 CRUD보다 관계 탐색이</text>
  <text x="1035" y="673" class="body">핵심일 때 검토</text>

  <rect x="120" y="735" width="960" height="58" class="card note"/>
  <text x="600" y="760" class="section">선택 기준</text>
  <text x="600" y="783" class="body">같은 JSON이나 이벤트 데이터라도 주요 조회 질문, 일관성 범위와 운영 책임에 따라 적합한 모델이 달라집니다.</text>

  <text x="600" y="812" class="small">핵심: NoSQL이라는 이름보다 어떤 키와 조건으로 얼마나 자주 읽고 쓰는지를 먼저 정의합니다.</text>
</svg>