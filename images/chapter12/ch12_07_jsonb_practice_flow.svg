<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">PostgreSQL JSONB 실습과 저장 방식 검토</title>
  <desc id="desc">일반 컬럼과 JSONB를 함께 사용하는 혼합 스키마에서 JSONB 조회와 수정, 구조 검증, 트랜잭션 원복, 질의 형태별 인덱스와 실행 계획을 확인한 뒤 PostgreSQL JSONB 유지 또는 전용 Document DB 검증 실험을 판단하는 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Arial,sans-serif;fill:#0f172a}
      .mono{font-family:Consolas,D2Coding,"Courier New",monospace}
      .title{font-size:30px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:14px;text-anchor:middle;fill:#475569}
      .head{font-size:17px;font-weight:800;text-anchor:middle}
      .section{font-size:14.5px;font-weight:700;text-anchor:middle}
      .body{font-size:13px;text-anchor:middle;fill:#334155}
      .small{font-size:11.8px;text-anchor:middle;fill:#475569}
      .step{font-size:12px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .label{font-size:12px;font-weight:700;text-anchor:middle}
      .yes{fill:#15803d}.no{fill:#b45309}
      .card{stroke-width:2;rx:16;ry:16}
      .principle{fill:#f8fafc;stroke:#94a3b8}
      .schema{fill:#eff6ff;stroke:#3b82f6}
      .query{fill:#f0fdf4;stroke:#22c55e}
      .validate{fill:#fff7ed;stroke:#f97316}
      .index{fill:#faf5ff;stroke:#8b5cf6}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:16;ry:16}
      .detail{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3;rx:11;ry:11}
      .decision{fill:#ffffff;stroke:#2563eb}
      .keep{fill:#eaf8ee;stroke:#16a34a}
      .poc{fill:#ecfeff;stroke:#06b6d4}
      .warning{fill:#fffbeb;stroke:#f59e0b}
      .line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#475569;stroke-width:2;fill:none;stroke-linejoin:round}
      .divider{stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1200" height="930" fill="#ffffff"/>
  <text x="600" y="46" class="title">PostgreSQL JSONB 실습과 저장 방식 검토</text>
  <text x="600" y="74" class="subtitle">연산자 사용만 확인하지 않고 구조·변경·인덱스·실행 계획과 운영 책임까지 검증합니다.</text>

  <rect x="90" y="100" width="1020" height="66" class="card principle"/>
  <text x="600" y="126" class="section">핵심 원칙</text>
  <text x="600" y="150" class="body">PostgreSQL JSONB로 문서형 요구를 먼저 검증하고, 전용 저장소는 운영상 이점이 분명할 때 작은 PoC로 비교합니다.</text>

  <!-- Horizontal practice flow -->
  <rect x="35" y="205" width="250" height="135" class="card schema"/>
  <circle cx="65" cy="235" r="15" fill="#3b82f6"/>
  <text x="65" y="240" class="step">1</text>
  <text x="160" y="242" class="head">혼합 스키마 확인</text>
  <text x="160" y="273" class="body">일반 컬럼: 코드·제목·버전·시각</text>
  <text x="160" y="297" class="mono body">metadata JSONB</text>
  <text x="160" y="321" class="small">안정된 핵심 속성과 가변 속성 분리</text>

  <rect x="330" y="205" width="250" height="135" class="card query"/>
  <circle cx="360" cy="235" r="15" fill="#22c55e"/>
  <text x="360" y="240" class="step">2</text>
  <text x="455" y="242" class="head">조회·수정 실행</text>
  <text x="455" y="273" class="mono body">-&gt; · -&gt;&gt; · ? · @&gt;</text>
  <text x="455" y="297" class="mono body">jsonb_set</text>
  <text x="455" y="321" class="small">문서 경로와 반환 타입을 구분</text>

  <rect x="625" y="205" width="250" height="135" class="card validate"/>
  <circle cx="655" cy="235" r="15" fill="#f97316"/>
  <text x="655" y="240" class="step">3</text>
  <text x="750" y="242" class="head">구조·변경 검증</text>
  <text x="750" y="273" class="body">타입·필수 키·허용 값·버전</text>
  <text x="750" y="297" class="mono body">BEGIN → UPDATE → ROLLBACK</text>
  <text x="750" y="321" class="small">변경 결과와 원복 결과를 함께 확인</text>

  <rect x="920" y="205" width="245" height="135" class="card index"/>
  <circle cx="950" cy="235" r="15" fill="#8b5cf6"/>
  <text x="950" y="240" class="step">4</text>
  <text x="1042" y="242" class="head">인덱스·계획 확인</text>
  <text x="1042" y="273" class="body">질의 형태별 인덱스 후보</text>
  <text x="1042" y="297" class="mono body">ANALYZE · EXPLAIN</text>
  <text x="1042" y="321" class="small">생성 여부와 실제 사용을 구분</text>

  <path d="M285 272.5 H330" class="line"/>
  <path d="M580 272.5 H625" class="line"/>
  <path d="M875 272.5 H920" class="line"/>

  <!-- Evidence matrix -->
  <text x="600" y="392" class="head">실습에서 확인할 실행 증거</text>
  <line x1="35" y1="410" x2="1165" y2="410" class="divider"/>

  <rect x="35" y="430" width="330" height="225" class="group"/>
  <text x="200" y="463" class="head">조회·수정 결과</text>
  <rect x="60" y="485" width="280" height="52" class="detail"/>
  <text x="200" y="506" class="mono section">metadata -&gt;&gt; 'level'</text>
  <text x="200" y="527" class="small">경로 값을 text로 조회</text>
  <rect x="60" y="548" width="280" height="52" class="detail"/>
  <text x="200" y="569" class="mono section">metadata ? 'instructor'</text>
  <text x="200" y="590" class="small">최상위 키 존재 확인</text>
  <rect x="60" y="611" width="280" height="30" class="detail"/>
  <text x="200" y="631" class="mono small">@&gt; 포함 검색 · jsonb_set 경로 수정</text>

  <rect x="390" y="430" width="380" height="225" class="group"/>
  <text x="580" y="463" class="head">구조·트랜잭션 검증</text>
  <text x="580" y="497" class="body">metadata가 객체이며 level·tags·options 타입이 맞는가?</text>
  <text x="580" y="524" class="body">level 허용 값과 document_version 규칙을 만족하는가?</text>
  <line x1="420" y1="543" x2="740" y2="543" class="divider"/>
  <text x="580" y="572" class="mono section">true / 1 → false / 2 → true / 1</text>
  <text x="580" y="599" class="small">변경 전 → 트랜잭션 안 수정 → ROLLBACK 후 원복</text>
  <text x="580" y="630" class="small">깊은 JSON 규칙은 컬럼·제약조건·애플리케이션 검증으로 분담</text>

  <rect x="795" y="430" width="370" height="225" class="group"/>
  <text x="980" y="463" class="head">질의 형태별 인덱스</text>
  <rect x="820" y="485" width="320" height="55" class="detail"/>
  <text x="980" y="507" class="mono section">metadata @&gt; ...</text>
  <text x="980" y="529" class="small">JSONB 전체 GIN 인덱스 후보</text>
  <rect x="820" y="551" width="320" height="55" class="detail"/>
  <text x="980" y="573" class="mono section">metadata -&gt;&gt; 'level' = 'basic'</text>
  <text x="980" y="595" class="small">표현식 B-tree 인덱스 후보</text>
  <text x="980" y="630" class="small">표본이 작으면 인덱스가 있어도 Seq Scan이 선택될 수 있음</text>

  <!-- Decision -->
  <path d="M600 655 V685" class="line"/>
  <rect x="270" y="685" width="660" height="82" class="card decision"/>
  <text x="600" y="717" class="head">PostgreSQL의 일반 컬럼 + JSONB로</text>
  <text x="600" y="745" class="head">조회·무결성·운영 요구를 충족하는가?</text>

  <path d="M600 767 V790" class="connector"/>
  <path d="M600 790 H275 V815" class="line"/>
  <path d="M600 790 H925 V815" class="line"/>
  <text x="420" y="784" class="label yes">예</text>
  <text x="780" y="784" class="label no">아니요</text>

  <rect x="60" y="815" width="430" height="80" class="card keep"/>
  <text x="275" y="845" class="head">JSONB 혼합 설계 유지</text>
  <text x="275" y="872" class="body">기존 JOIN·트랜잭션·백업·권한 체계를 함께 활용</text>

  <rect x="710" y="815" width="430" height="80" class="card poc"/>
  <text x="925" y="845" class="head">전용 Document DB 작은 PoC</text>
  <text x="925" y="872" class="body">대표 조회·쓰기·지연·장애·복구와 운영 비용을 비교</text>

  <text x="600" y="919" class="small">핵심: JSONB 연산자가 동작한다는 사실만으로 선택하지 않고, 원본·동기화·보안·백업·복구 책임까지 포함해 저장 방식을 결정합니다.</text>
</svg>