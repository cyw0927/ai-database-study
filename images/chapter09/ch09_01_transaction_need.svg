<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">트랜잭션이 필요한 이유와 확정 판단</title>
  <desc id="desc">잔여 좌석 차감, 수강신청 생성과 결제 생성을 하나의 트랜잭션에서 순서대로 실행하고 영향 행 수와 관계를 검증한다. 모든 결과가 맞으면 커밋하고 하나라도 실패하거나 예상과 다르면 롤백해 부분 성공으로 인한 데이터 모순을 방지하는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Arial,sans-serif;fill:#0f172a}
      .mono{font-family:Consolas,D2Coding,"Courier New",monospace}
      .title{font-size:30px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:14px;text-anchor:middle;fill:#475569}
      .head{font-size:18px;font-weight:800;text-anchor:middle}
      .section{font-size:15px;font-weight:700;text-anchor:middle}
      .body{font-size:13px;text-anchor:middle;fill:#334155}
      .small{font-size:11.8px;text-anchor:middle;fill:#475569}
      .step{font-size:12px;font-weight:700;text-anchor:middle;fill:#ffffff}
      .label{font-size:12px;font-weight:700;text-anchor:middle}
      .yes{fill:#15803d}.no{fill:#b45309}
      .card{stroke-width:2;rx:16;ry:16}
      .principle{fill:#f8fafc;stroke:#94a3b8}
      .tx-boundary{fill:#fcfbff;stroke:#8b5cf6;stroke-width:2;stroke-dasharray:8 6;rx:20;ry:20}
      .seat{fill:#fff7ed;stroke:#f97316}
      .enrollment{fill:#eff6ff;stroke:#3b82f6}
      .payment{fill:#f0fdf4;stroke:#22c55e}
      .verify{fill:#faf5ff;stroke:#8b5cf6}
      .decision{fill:#ffffff;stroke:#2563eb}
      .rollback{fill:#fff7ed;stroke:#f97316}
      .commit{fill:#eaf8ee;stroke:#16a34a}
      .failure-group{fill:#fff8f8;stroke:#fda4af;stroke-width:1.6;rx:18;ry:18}
      .failure{fill:#fff1f2;stroke:#e11d48;stroke-width:1.5;rx:13;ry:13}
      .note{fill:#ecfeff;stroke:#06b6d4}
      .line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#94a3b8;stroke-width:1.7;fill:none;stroke-linejoin:round}
      .divider{stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1200" height="1100" fill="#ffffff"/>
  <text x="600" y="46" class="title">트랜잭션이 필요한 이유</text>
  <text x="600" y="74" class="subtitle">관련 변경을 같은 성공·실패 경계에 묶고, 실행 결과를 검증한 뒤 한 번에 확정하거나 취소합니다.</text>

  <rect x="90" y="100" width="1020" height="66" class="card principle"/>
  <text x="600" y="126" class="section">핵심 원칙</text>
  <text x="600" y="150" class="body">좌석·수강신청·결제 변경을 같은 트랜잭션에서 실행하고, 영향 행 수와 최종 관계가 모두 맞을 때만 COMMIT합니다.</text>

  <!-- Transaction boundary -->
  <rect x="35" y="195" width="1130" height="230" class="tx-boundary"/>
  <text x="600" y="225" class="head">BEGIN — 하나의 업무 성공·실패 경계</text>
  <line x1="65" y1="242" x2="1135" y2="242" class="divider"/>

  <rect x="55" y="265" width="245" height="130" class="card seat"/>
  <circle cx="83" cy="293" r="15" fill="#f97316"/>
  <text x="83" y="298" class="step">1</text>
  <text x="178" y="299" class="head">조건부 좌석 차감</text>
  <text x="178" y="331" class="mono body">remaining_seats &gt; 0</text>
  <text x="178" y="355" class="body">좌석 UPDATE 영향 행 수 확인</text>
  <text x="178" y="378" class="small">정상 기대값: 1행</text>

  <rect x="335" y="265" width="245" height="130" class="card enrollment"/>
  <circle cx="363" cy="293" r="15" fill="#3b82f6"/>
  <text x="363" y="298" class="step">2</text>
  <text x="458" y="299" class="head">수강신청 생성</text>
  <text x="458" y="331" class="mono body">enrollments INSERT</text>
  <text x="458" y="355" class="body">학생과 강의를 신청 행으로 연결</text>
  <text x="458" y="378" class="small">생성된 enrollment ID 확보</text>

  <rect x="615" y="265" width="245" height="130" class="card payment"/>
  <circle cx="643" cy="293" r="15" fill="#22c55e"/>
  <text x="643" y="298" class="step">3</text>
  <text x="738" y="299" class="head">결제 행 생성</text>
  <text x="738" y="331" class="mono body">payments INSERT</text>
  <text x="738" y="355" class="body">생성된 수강신청을 참조</text>
  <text x="738" y="378" class="small">금액·상태·참조 관계 기록</text>

  <rect x="895" y="265" width="245" height="130" class="card verify"/>
  <circle cx="923" cy="293" r="15" fill="#8b5cf6"/>
  <text x="923" y="298" class="step">4</text>
  <text x="1018" y="299" class="head">COMMIT 전 검증</text>
  <text x="1018" y="331" class="body">신청·결제·좌석 관계 확인</text>
  <text x="1018" y="355" class="body">금액·상태·영향 행 수 비교</text>
  <text x="1018" y="378" class="small">검증 SELECT의 실제 결과 사용</text>

  <path d="M300 330 H335" class="line"/>
  <path d="M580 330 H615" class="line"/>
  <path d="M860 330 H895" class="line"/>

  <!-- Decision -->
  <path d="M1018 395 V445 H600 V470" class="line"/>
  <rect x="270" y="470" width="660" height="92" class="card decision"/>
  <text x="600" y="504" class="head">모든 SQL이 성공하고 영향 행 수와</text>
  <text x="600" y="533" class="head">최종 관계가 예상 결과와 일치하는가?</text>

  <path d="M600 562 V592" class="connector"/>
  <path d="M600 592 H275 V620" class="line"/>
  <path d="M600 592 H925 V620" class="line"/>
  <text x="420" y="585" class="label no">아니요</text>
  <text x="780" y="585" class="label yes">예</text>

  <rect x="60" y="620" width="430" height="92" class="card rollback"/>
  <text x="275" y="652" class="head">ROLLBACK</text>
  <text x="275" y="679" class="body">오류·0행 변경·관계 불일치가 있으면</text>
  <text x="275" y="700" class="small">아직 확정되지 않은 세 변경을 모두 취소</text>

  <rect x="710" y="620" width="430" height="92" class="card commit"/>
  <text x="925" y="652" class="head">COMMIT</text>
  <text x="925" y="679" class="body">좌석·신청·결제의 일관된 상태를</text>
  <text x="925" y="700" class="small">하나의 업무 결과로 함께 확정</text>

  <!-- Partial success examples -->
  <rect x="35" y="755" width="1130" height="230" class="failure-group"/>
  <text x="600" y="787" class="head">트랜잭션 없이 각 작업을 독립 확정하면 남을 수 있는 모순</text>
  <line x1="65" y1="805" x2="1135" y2="805" class="divider"/>

  <rect x="60" y="830" width="255" height="120" class="failure"/>
  <text x="187.5" y="863" class="section">좌석만 감소</text>
  <text x="187.5" y="892" class="body">신청 행이 생성되지 않음</text>
  <text x="187.5" y="922" class="small">재고와 실제 신청 수 불일치</text>

  <rect x="335" y="830" width="255" height="120" class="failure"/>
  <text x="462.5" y="863" class="section">신청은 있지만 결제 없음</text>
  <text x="462.5" y="892" class="body">수강 상태와 결제 상태가 모순</text>
  <text x="462.5" y="922" class="small">업무 완료 여부 판단 불가</text>

  <rect x="610" y="830" width="255" height="120" class="failure"/>
  <text x="737.5" y="863" class="section">결제는 있지만 신청 없음</text>
  <text x="737.5" y="892" class="body">결제 행의 업무 대상이 사라짐</text>
  <text x="737.5" y="922" class="small">연결 관계와 환불 처리 문제</text>

  <rect x="885" y="830" width="255" height="120" class="failure"/>
  <text x="1012.5" y="863" class="section">신청·결제만 확정</text>
  <text x="1012.5" y="892" class="body">잔여 좌석이 감소하지 않음</text>
  <text x="1012.5" y="922" class="small">초과 신청 가능성 발생</text>

  <rect x="120" y="1015" width="960" height="58" class="card note"/>
  <text x="600" y="1039" class="section">트랜잭션만으로 잘못된 SQL을 자동 차단하지는 않습니다.</text>
  <text x="600" y="1062" class="small">제약조건·업무 조건·영향 행 수·검증 SELECT를 함께 사용해 COMMIT의 근거를 확인합니다.</text>

  <text x="600" y="1092" class="small">핵심: 여러 SQL을 묶는 것이 아니라 하나의 업무가 어디까지 성공해야 확정되는지를 설계하는 것이 트랜잭션입니다.</text>
</svg>