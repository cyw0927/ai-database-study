<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">ACID의 네 가지 기본 특성</title>
  <desc id="desc">Atomicity, Consistency, Isolation, Durability의 입문 수준 의미와 수강신청 예시를 보여 준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>.ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
.mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #4b5563; }
.box-title { font-size: 18px; font-weight: 700; }
.body { font-size: 14px; }
.small { font-size: 12.5px; fill: #4b5563; }
.card { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }
.start { fill: #eaf3ff; }
.work { fill: #eef5ff; }
.review { fill: #fff6d8; }
.ok { fill: #eaf8ee; }
.fail { fill: #ffeaea; }
.rule { fill: #f2ecff; }
.lock { fill: #fff0d9; }
.line { stroke: #475569; stroke-width: 2.2; fill: none; }
.dash { stroke: #b45309; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; }
.retry { stroke: #b91c1c; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; }</style>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="ko title">
    <tspan x="600" dy="0">ACID의 네 가지 기본 특성</tspan>
  </text>
  <text x="600" y="70" text-anchor="middle" class="ko subtitle">
    <tspan x="600" dy="0">트랜잭션의 안전성을 이해하는 네 가지 관점입니다.</tspan>
  </text>
  <rect x="35" y="140" width="260" height="205" rx="14" ry="14" class="card work"/>
  <text x="165" y="185" text-anchor="middle" class="ko box-title">
    <tspan x="165" dy="0">Atomicity</tspan>
  </text>
  <text x="165" y="235" text-anchor="middle" class="ko body">
    <tspan x="165" dy="0">모두 반영</tspan>
    <tspan x="165" dy="28">또는 모두 취소</tspan>
  </text>
  <rect x="325" y="140" width="260" height="205" rx="14" ry="14" class="card rule"/>
  <text x="455" y="185" text-anchor="middle" class="ko box-title">
    <tspan x="455" dy="0">Consistency</tspan>
  </text>
  <text x="455" y="235" text-anchor="middle" class="ko body">
    <tspan x="455" dy="0">정해진 규칙을</tspan>
    <tspan x="455" dy="28">만족하는 상태</tspan>
  </text>
  <rect x="615" y="140" width="260" height="205" rx="14" ry="14" class="card lock"/>
  <text x="745" y="185" text-anchor="middle" class="ko box-title">
    <tspan x="745" dy="0">Isolation</tspan>
  </text>
  <text x="745" y="235" text-anchor="middle" class="ko body">
    <tspan x="745" dy="0">동시 작업의</tspan>
    <tspan x="745" dy="28">간섭을 제어</tspan>
  </text>
  <rect x="905" y="140" width="260" height="205" rx="14" ry="14" class="card ok"/>
  <text x="1035" y="185" text-anchor="middle" class="ko box-title">
    <tspan x="1035" dy="0">Durability</tspan>
  </text>
  <text x="1035" y="235" text-anchor="middle" class="ko body">
    <tspan x="1035" dy="0">COMMIT 결과를</tspan>
    <tspan x="1035" dy="28">장애 이후에도 유지</tspan>
  </text>
  <rect x="270" y="405" width="660" height="65" rx="14" ry="14" class="card start"/>
  <text x="600" y="432" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">수강신청 · 결제 · 좌석 변경</tspan>
  </text>
  <text x="600" y="458" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">안전한 하나의 업무 단위로 처리</tspan>
  </text>
  <path d="M 165 345 V 375 H 600 V 405" class="line" marker-end="url(#arrow)"/>
  <path d="M 455 345 V 375 H 600 V 405" class="line" marker-end="url(#arrow)"/>
  <path d="M 745 345 V 375 H 600 V 405" class="line" marker-end="url(#arrow)"/>
  <path d="M 1035 345 V 375 H 600 V 405" class="line" marker-end="url(#arrow)"/>
</svg>
