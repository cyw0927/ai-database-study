<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">SQL Injection 방어와 안전한 쿼리 실행</title>
  <desc id="desc">외부 입력을 값과 식별자 또는 SQL 문법 선택으로 구분한다. 값은 고정 SQL의 자리표시자에 별도 파라미터로 전달하고, 컬럼명과 정렬 방향 같은 식별자는 애플리케이션 허용 목록에서만 선택한다. 문자열 결합을 금지하고 정상 입력, 공격 형태 입력, 최소 권한 계정의 거부 작업을 검증하는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"NanumSquare","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","UnDotum",Arial,sans-serif;fill:#0f172a}
      .mono{font-family:"Noto Sans Mono CJK KR","NanumSquare",Consolas,D2Coding,"Courier New",monospace}
      .title{font-size:30px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:14px;text-anchor:middle;fill:#475569}
      .head{font-size:18px;font-weight:800;text-anchor:middle}
      .section{font-size:15px;font-weight:700;text-anchor:middle}
      .body{font-size:13px;text-anchor:middle;fill:#334155}
      .small{font-size:11.8px;text-anchor:middle;fill:#475569}
      .step{font-size:12px;font-weight:700;text-anchor:middle;fill:#ffffff}
      .label{font-size:12px;font-weight:700;text-anchor:middle}
      .yes{fill:#15803d}.no{fill:#b45309}
      .card{stroke-width:2;rx:16;ry:16}
      .principle{fill:#f8fafc;stroke:#94a3b8}
      .input{fill:#eff6ff;stroke:#3b82f6}
      .classify{fill:#fff7ed;stroke:#f97316}
      .handle{fill:#faf5ff;stroke:#8b5cf6}
      .verify{fill:#f0fdf4;stroke:#22c55e}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}
      .unsafe{fill:#fff1f2;stroke:#e11d48}
      .value{fill:#ecfdf5;stroke:#22c55e}
      .identifier{fill:#eff6ff;stroke:#3b82f6}
      .detail{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3;rx:10;ry:10}
      .normal{fill:#ecfdf5;stroke:#22c55e}
      .attack{fill:#fff7ed;stroke:#f97316}
      .defense{fill:#faf5ff;stroke:#8b5cf6}
      .decision{fill:#ffffff;stroke:#2563eb}
      .success{fill:#eaf8ee;stroke:#16a34a}
      .revise{fill:#fff7ed;stroke:#f97316}
      .line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#94a3b8;stroke-width:1.7;fill:none;stroke-linejoin:round}
      .loop{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .divider{stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1200" height="1160" fill="#ffffff"/>
  <text x="600" y="46" class="title">SQL Injection 방어와 안전한 쿼리 실행</text>
  <text x="600" y="74" class="subtitle">입력 검증만 믿지 않고 SQL 구조와 값을 분리하며, 동적 식별자는 허용 목록으로 제한합니다.</text>

  <rect x="90" y="100" width="1020" height="66" class="card principle"/>
  <text x="600" y="126" class="section">핵심 원칙</text>
  <text x="600" y="150" class="body">값은 파라미터로 바인딩하고, 컬럼명·테이블명·정렬 방향처럼 값 파라미터로 처리할 수 없는 선택은 애플리케이션 허용 목록에서만 결정합니다.</text>

  <!-- Main flow -->
  <rect x="35" y="205" width="250" height="135" class="card input"/>
  <circle cx="65" cy="235" r="15" fill="#3b82f6"/>
  <text x="65" y="240" class="step">1</text>
  <text x="160" y="242" class="head">외부 입력 식별</text>
  <text x="160" y="273" class="body">이메일 · 검색어 · 상태</text>
  <text x="160" y="297" class="body">정렬 컬럼 · 정렬 방향</text>
  <text x="160" y="321" class="small">입력의 출처와 사용 위치를 먼저 기록</text>

  <rect x="330" y="205" width="250" height="135" class="card classify"/>
  <circle cx="360" cy="235" r="15" fill="#f97316"/>
  <text x="360" y="240" class="step">2</text>
  <text x="455" y="242" class="head">입력 용도 분류</text>
  <text x="455" y="273" class="body">값으로 비교할 입력인가?</text>
  <text x="455" y="297" class="body">식별자·SQL 문법 선택인가?</text>
  <text x="455" y="321" class="small">두 종류를 같은 방식으로 결합하지 않음</text>

  <rect x="625" y="205" width="250" height="135" class="card handle"/>
  <circle cx="655" cy="235" r="15" fill="#8b5cf6"/>
  <text x="655" y="240" class="step">3</text>
  <text x="750" y="242" class="head">안전한 처리</text>
  <text x="750" y="273" class="body">고정 SQL + 자리표시자</text>
  <text x="750" y="297" class="body">식별자 허용 목록·미등록 값 거부</text>
  <text x="750" y="321" class="small">문자열 결합과 임의 템플릿 치환 금지</text>

  <rect x="920" y="205" width="245" height="135" class="card verify"/>
  <circle cx="950" cy="235" r="15" fill="#22c55e"/>
  <text x="950" y="240" class="step">4</text>
  <text x="1042" y="242" class="head">동일 조건 검증</text>
  <text x="1042" y="273" class="body">정상 입력 · 공격 형태 입력</text>
  <text x="1042" y="297" class="body">최소 권한 계정의 거부 작업</text>
  <text x="1042" y="321" class="small">결과·오류·실행 권한을 증거로 기록</text>

  <path d="M285 272.5 H330" class="line"/>
  <path d="M580 272.5 H625" class="line"/>
  <path d="M875 272.5 H920" class="line"/>

  <!-- Handling comparison -->
  <path d="M750 340 V375" class="connector"/>
  <text x="600" y="392" class="head">입력 종류별 처리 방식</text>
  <line x1="35" y1="410" x2="1165" y2="410" class="divider"/>

  <rect x="35" y="430" width="350" height="245" class="card unsafe"/>
  <text x="210" y="463" class="head">금지: 문자열 결합</text>
  <text x="210" y="491" class="mono body">SQL 문자열 + user_input</text>
  <rect x="65" y="515" width="290" height="72" class="detail"/>
  <text x="210" y="541" class="section">발생 가능한 문제</text>
  <text x="210" y="565" class="body">입력 내용이 SQL 문법과 명령 구조로 해석</text>
  <text x="210" y="616" class="body">단순 이스케이프·입력 검증만으로 방어를 끝내지 않음</text>
  <text x="210" y="645" class="small">오류가 없더라도 의도하지 않은 조건이 실행될 수 있음</text>

  <rect x="425" y="430" width="350" height="245" class="card value"/>
  <text x="600" y="463" class="head">값 입력: 파라미터 바인딩</text>
  <text x="600" y="491" class="mono body">WHERE email = $1</text>
  <rect x="455" y="515" width="290" height="72" class="detail"/>
  <text x="600" y="541" class="section">SQL과 값을 분리</text>
  <text x="600" y="565" class="mono body">params = [user_input]</text>
  <text x="600" y="616" class="body">입력은 SQL 문법이 아니라 하나의 데이터 값으로 전달</text>
  <text x="600" y="645" class="small">이메일·상태·검색어·숫자 조건 등에 적용</text>

  <rect x="815" y="430" width="350" height="245" class="card identifier"/>
  <text x="990" y="463" class="head">식별자 선택: 허용 목록</text>
  <text x="990" y="491" class="body">컬럼명·테이블명·정렬 방향은 별도 처리</text>
  <rect x="845" y="515" width="290" height="72" class="detail"/>
  <text x="990" y="541" class="mono section">sort: name | joined_at</text>
  <text x="990" y="565" class="mono body">direction: ASC | DESC</text>
  <text x="990" y="616" class="body">외부 문자열을 그대로 붙이지 않고 내부 상수로 매핑</text>
  <text x="990" y="645" class="small">허용 목록에 없는 값은 쿼리 실행 전에 거부</text>

  <!-- Verification -->
  <path d="M600 675 V710" class="connector"/>
  <text x="600" y="733" class="head">실행으로 확인할 세 가지 증거</text>
  <line x1="35" y1="751" x2="1165" y2="751" class="divider"/>

  <rect x="35" y="770" width="350" height="145" class="card normal"/>
  <text x="210" y="803" class="head">정상 기능 테스트</text>
  <text x="210" y="832" class="body">정상 이메일·검색어로 의도한 행만 반환되는가?</text>
  <text x="210" y="858" class="body">허용된 정렬 컬럼과 방향이 정확히 적용되는가?</text>
  <text x="210" y="887" class="small">보안 수정 후 기존 기능이 깨지지 않아야 함</text>

  <rect x="425" y="770" width="350" height="145" class="card attack"/>
  <text x="600" y="803" class="head">공격 형태 입력 테스트</text>
  <text x="600" y="832" class="body">따옴표·연산자·주석 형태가 포함되어도</text>
  <text x="600" y="858" class="body">SQL 구조가 바뀌지 않고 하나의 값으로 처리되는가?</text>
  <text x="600" y="887" class="small">예상된 빈 결과·검증 오류도 정상적인 방어 결과</text>

  <rect x="815" y="770" width="350" height="145" class="card defense"/>
  <text x="990" y="803" class="head">심층 방어 테스트</text>
  <text x="990" y="832" class="body">앱 계정의 불필요한 DELETE·DDL이 거부되는가?</text>
  <text x="990" y="858" class="body">오류 응답에 SQL·접속 정보가 과도하게 노출되지 않는가?</text>
  <text x="990" y="887" class="small">최소 권한은 주 방어 실패 시 피해 범위를 줄임</text>

  <!-- Decision -->
  <path d="M600 915 V945" class="line"/>
  <rect x="270" y="945" width="660" height="88" class="card decision"/>
  <text x="600" y="978" class="head">정상 기능은 동작하고 외부 입력으로 SQL 구조가 바뀌지 않으며</text>
  <text x="600" y="1007" class="head">불필요한 작업은 계정 권한으로 거부되는가?</text>

  <path d="M600 1033 V1058" class="connector"/>
  <path d="M600 1058 H275 V1082" class="line"/>
  <path d="M600 1058 H925 V1082" class="line"/>
  <text x="420" y="1051" class="label no">아니요</text>
  <text x="780" y="1051" class="label yes">예</text>

  <rect x="60" y="1082" width="430" height="62" class="card revise"/>
  <text x="275" y="1108" class="head">쿼리·허용 목록·권한 수정 후 재검증</text>
  <text x="275" y="1131" class="small">문자열 결합 제거·미등록 입력 거부·오류 메시지 제한</text>

  <rect x="710" y="1082" width="430" height="62" class="card success"/>
  <text x="925" y="1108" class="head">검증 완료·보안 근거 기록</text>
  <text x="925" y="1131" class="small">고정 SQL·파라미터·허용 목록·긍정/부정 테스트 결과 보존</text>

  <path d="M120 1082 V930 H210 V915" class="loop"/>
  <text x="190" y="953" class="small">같은 테스트 재실행</text>

  <text x="600" y="1154" class="small">핵심: 파라미터 바인딩이 1차 방어이며, 허용 목록·최소 권한·오류 제한·보안 테스트를 함께 적용합니다.</text>
</svg>