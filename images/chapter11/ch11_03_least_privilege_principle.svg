<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">최소 권한을 작업 행렬로 설계하는 절차</title>
  <desc id="desc">업무 작업을 정의하고 데이터베이스, 스키마, 테이블, 컬럼과 시퀀스 범위를 확인한 뒤 보고 역할과 수강신청 앱 역할의 허용·불허 작업 행렬을 작성한다. NOLOGIN 권한 역할에 필요한 권한만 부여하고 LOGIN 역할에는 멤버십을 연결한 후 허용 작업 성공과 불필요한 작업 거부를 유효 권한 함수, 역할 멤버십, PUBLIC과 소유권까지 포함해 검증하는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"NanumSquare","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","UnDotum",Arial,sans-serif;fill:#0f172a}
      .mono{font-family:"Noto Sans Mono CJK KR","NanumSquare",Consolas,D2Coding,"Courier New",monospace}
      .title{font-size:30px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:14px;text-anchor:middle;fill:#475569}
      .head{font-size:18px;font-weight:800;text-anchor:middle}
      .section{font-size:15px;font-weight:700;text-anchor:middle}
      .body{font-size:13px;text-anchor:middle;fill:#334155}
      .small{font-size:11.8px;text-anchor:middle;fill:#475569}
      .step{font-size:12px;font-weight:700;text-anchor:middle;fill:#ffffff}
      .label{font-size:12px;font-weight:700;text-anchor:middle}
      .yes{fill:#15803d}.no{fill:#b45309}
      .card{stroke-width:2;rx:16;ry:16}
      .principle{fill:#f8fafc;stroke:#94a3b8}
      .task{fill:#eff6ff;stroke:#3b82f6}
      .object{fill:#f8fafc;stroke:#64748b}
      .matrix{fill:#fff7ed;stroke:#f97316}
      .grant{fill:#faf5ff;stroke:#8b5cf6}
      .report{fill:#eff6ff;stroke:#3b82f6}
      .app{fill:#f0fdf4;stroke:#22c55e}
      .allow{fill:#ecfdf5;stroke:#86efac;stroke-width:1.4;rx:12;ry:12}
      .deny{fill:#fff1f2;stroke:#fda4af;stroke-width:1.4;rx:12;ry:12}
      .verify{fill:#f8fafc;stroke:#64748b}
      .positive{fill:#ecfdf5;stroke:#22c55e}
      .negative{fill:#fff1f2;stroke:#e11d48}
      .effective{fill:#fffbeb;stroke:#f59e0b}
      .decision{fill:#ffffff;stroke:#2563eb}
      .success{fill:#eaf8ee;stroke:#16a34a}
      .revise{fill:#fff7ed;stroke:#f97316}
      .line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#94a3b8;stroke-width:1.7;fill:none;stroke-linejoin:round}
      .loop{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .divider{stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1200" height="1220" fill="#ffffff"/>
  <text x="600" y="46" class="title">최소 권한을 작업 행렬로 설계</text>
  <text x="600" y="74" class="subtitle">역할 이름이나 ALL PRIVILEGES에서 시작하지 않고, 실제 업무 작업과 객체 범위에서 필요한 권한만 도출합니다.</text>

  <rect x="90" y="100" width="1020" height="66" class="card principle"/>
  <text x="600" y="126" class="section">핵심 원칙</text>
  <text x="600" y="150" class="body">필요한 작업은 성공하고 불필요한 작업은 거부되어야 하며, 직접 GRANT뿐 아니라 멤버십·PUBLIC·소유권까지 포함한 유효 권한을 확인합니다.</text>

  <!-- Design flow -->
  <rect x="35" y="205" width="250" height="135" class="card task"/>
  <circle cx="65" cy="235" r="15" fill="#3b82f6"/>
  <text x="65" y="240" class="step">1</text>
  <text x="160" y="242" class="head">업무 작업 정의</text>
  <text x="160" y="273" class="body">보고 조회 · 수강신청 입력</text>
  <text x="160" y="297" class="body">수강 상태 변경</text>
  <text x="160" y="321" class="small">주체가 실제로 수행할 작업부터 기록</text>

  <rect x="330" y="205" width="250" height="135" class="card object"/>
  <circle cx="360" cy="235" r="15" fill="#64748b"/>
  <text x="360" y="240" class="step">2</text>
  <text x="455" y="242" class="head">객체와 범위 확인</text>
  <text x="455" y="273" class="mono body">DATABASE · SCHEMA</text>
  <text x="455" y="297" class="mono body">TABLE · COLUMN · SEQUENCE</text>
  <text x="455" y="321" class="small">CONNECT·USAGE와 행 작업을 구분</text>

  <rect x="625" y="205" width="250" height="135" class="card matrix"/>
  <circle cx="655" cy="235" r="15" fill="#f97316"/>
  <text x="655" y="240" class="step">3</text>
  <text x="750" y="242" class="head">역할별 작업 행렬</text>
  <text x="750" y="273" class="body">허용 작업과 불허 작업</text>
  <text x="750" y="297" class="body">필요한 컬럼 범위까지 명시</text>
  <text x="750" y="321" class="small">DELETE·CREATE 같은 금지 작업도 기록</text>

  <rect x="920" y="205" width="245" height="135" class="card grant"/>
  <circle cx="950" cy="235" r="15" fill="#8b5cf6"/>
  <text x="950" y="240" class="step">4</text>
  <text x="1042" y="242" class="head">권한 역할에 부여</text>
  <text x="1042" y="273" class="mono body">GRANT → NOLOGIN Role</text>
  <text x="1042" y="297" class="body">LOGIN Role에는 멤버십 연결</text>
  <text x="1042" y="321" class="small">소유 역할과 실행 역할 분리</text>

  <path d="M285 272.5 H330" class="line"/>
  <path d="M580 272.5 H625" class="line"/>
  <path d="M875 272.5 H920" class="line"/>

  <!-- Role matrix -->
  <text x="600" y="390" class="head">역할별 최소 권한 예시</text>
  <line x1="35" y1="408" x2="1165" y2="408" class="divider"/>

  <rect x="35" y="430" width="550" height="270" class="card report"/>
  <text x="310" y="463" class="head">보고 권한 역할</text>
  <text x="310" y="488" class="mono small">lab_role_report_reader · NOLOGIN</text>
  <rect x="65" y="510" width="490" height="92" class="allow"/>
  <text x="310" y="537" class="section">허용</text>
  <text x="310" y="563" class="mono body">students · courses · enrollments → SELECT</text>
  <text x="310" y="586" class="small">DATABASE CONNECT · SCHEMA USAGE 포함</text>
  <rect x="65" y="615" width="490" height="62" class="deny"/>
  <text x="310" y="640" class="section">불허</text>
  <text x="310" y="663" class="mono body">INSERT · UPDATE · DELETE · SCHEMA CREATE</text>

  <rect x="615" y="430" width="550" height="270" class="card app"/>
  <text x="890" y="463" class="head">수강신청 앱 권한 역할</text>
  <text x="890" y="488" class="mono small">lab_role_enrollment_app · NOLOGIN</text>
  <rect x="645" y="510" width="490" height="112" class="allow"/>
  <text x="890" y="537" class="section">허용</text>
  <text x="890" y="562" class="mono body">students · courses → SELECT</text>
  <text x="890" y="585" class="mono body">enrollments → SELECT · INSERT · UPDATE(status)</text>
  <text x="890" y="608" class="mono small">enrollments_id_seq → USAGE · SELECT</text>
  <rect x="645" y="635" width="490" height="42" class="deny"/>
  <text x="890" y="661" class="mono body">DELETE · SCHEMA CREATE · ALL PRIVILEGES 불허</text>

  <!-- Verification evidence -->
  <path d="M600 700 V735" class="connector"/>
  <text x="600" y="758" class="head">5. 허용·거부·유효 권한을 함께 검증</text>
  <line x1="35" y1="776" x2="1165" y2="776" class="divider"/>

  <rect x="35" y="795" width="350" height="130" class="card positive"/>
  <text x="210" y="827" class="head">긍정 테스트</text>
  <text x="210" y="856" class="body">보고 계정의 SELECT가 성공하는가?</text>
  <text x="210" y="880" class="body">앱 계정의 INSERT와 status UPDATE가 성공하는가?</text>
  <text x="210" y="906" class="small">필요한 업무 경로가 실제로 동작해야 함</text>

  <rect x="425" y="795" width="350" height="130" class="card negative"/>
  <text x="600" y="827" class="head">부정 테스트</text>
  <text x="600" y="856" class="body">보고 계정의 INSERT·DELETE가 거부되는가?</text>
  <text x="600" y="880" class="body">앱 계정의 DELETE·SCHEMA CREATE가 거부되는가?</text>
  <text x="600" y="906" class="small">오류가 발생해야 하는 작업도 테스트 증거</text>

  <rect x="815" y="795" width="350" height="130" class="card effective"/>
  <text x="990" y="827" class="head">유효 권한 경로</text>
  <text x="990" y="856" class="mono body">has_*_privilege · role_table_grants</text>
  <text x="990" y="880" class="body">직접 GRANT · 역할 멤버십 · PUBLIC · 소유권</text>
  <text x="990" y="906" class="small">REVOKE 후에도 다른 경로로 남는지 확인</text>

  <!-- Decision -->
  <path d="M600 925 V955" class="line"/>
  <rect x="270" y="955" width="660" height="88" class="card decision"/>
  <text x="600" y="988" class="head">필요한 작업은 성공하고</text>
  <text x="600" y="1017" class="head">불필요한 작업은 모두 거부되는가?</text>

  <path d="M600 1043 V1068" class="connector"/>
  <path d="M600 1068 H275 V1092" class="line"/>
  <path d="M600 1068 H925 V1092" class="line"/>
  <text x="420" y="1061" class="label no">아니요</text>
  <text x="780" y="1061" class="label yes">예</text>

  <rect x="60" y="1092" width="430" height="82" class="card revise"/>
  <text x="275" y="1123" class="head">권한 조정 후 재검증</text>
  <text x="275" y="1150" class="body">누락 권한은 최소 범위로 추가하고 과도한 권한은 REVOKE</text>

  <rect x="710" y="1092" width="430" height="82" class="card success"/>
  <text x="925" y="1123" class="head">검증 완료·증거 기록</text>
  <text x="925" y="1150" class="body">작업 행렬·GRANT·테스트 결과·예외 근거를 함께 보존</text>

  <path d="M120 1092 V950 H210 V925" class="loop"/>
  <text x="190" y="972" class="small">같은 테스트 재실행</text>

  <text x="600" y="1205" class="small">핵심: 권한 목록만 보는 것이 아니라 실제 허용 작업과 거부 작업을 모두 실행하고, 현재 객체·미래 객체·PUBLIC·소유권 경로까지 구분해 검증합니다.</text>
</svg>
