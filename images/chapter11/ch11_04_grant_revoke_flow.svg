<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">GRANT·REVOKE 후 유효 권한 검증</title>
  <desc id="desc">정책과 변경 대상을 확인하고 테스트 환경에서 GRANT 또는 REVOKE를 실행한 뒤 직접 권한, 역할 멤버십, PUBLIC, 객체 소유권 경로를 병렬로 조사한다. has privilege 함수와 실제 허용·거부 작업을 함께 검증해 정책과 일치하면 증거를 기록하고, 일치하지 않으면 남은 권한 경로를 조정해 같은 테스트를 반복하는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"NanumSquare","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","UnDotum",Arial,sans-serif;fill:#0f172a}
      .mono{font-family:"Noto Sans Mono CJK KR","NanumSquare",Consolas,D2Coding,"Courier New",monospace}
      .title{font-size:30px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:14px;text-anchor:middle;fill:#475569}
      .head{font-size:18px;font-weight:800;text-anchor:middle}
      .section{font-size:15px;font-weight:700;text-anchor:middle}
      .body{font-size:13px;text-anchor:middle;fill:#334155}
      .small{font-size:11.8px;text-anchor:middle;fill:#475569}
      .step{font-size:12px;font-weight:700;text-anchor:middle;fill:#ffffff}
      .label{font-size:12px;font-weight:700;text-anchor:middle}
      .yes{fill:#15803d}.no{fill:#b45309}
      .card{stroke-width:2;rx:16;ry:16}
      .principle{fill:#f8fafc;stroke:#94a3b8}
      .policy{fill:#eff6ff;stroke:#3b82f6}
      .change{fill:#fff7ed;stroke:#f97316}
      .paths{fill:#faf5ff;stroke:#8b5cf6}
      .verify{fill:#f0fdf4;stroke:#22c55e}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}
      .direct{fill:#eff6ff;stroke:#7fb3f5}
      .membership{fill:#faf5ff;stroke:#c4b5fd}
      .public{fill:#fffbeb;stroke:#fcd34d}
      .owner{fill:#fff1f2;stroke:#fda4af}
      .positive{fill:#ecfdf5;stroke:#22c55e}
      .negative{fill:#fff1f2;stroke:#e11d48}
      .evidence{fill:#f8fafc;stroke:#64748b}
      .decision{fill:#ffffff;stroke:#2563eb}
      .success{fill:#eaf8ee;stroke:#16a34a}
      .revise{fill:#fff7ed;stroke:#f97316}
      .detail{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3;rx:10;ry:10}
      .line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#94a3b8;stroke-width:1.7;fill:none;stroke-linejoin:round}
      .loop{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .divider{stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1200" height="1120" fill="#ffffff"/>
  <text x="600" y="46" class="title">GRANT·REVOKE 후 유효 권한 검증</text>
  <text x="600" y="74" class="subtitle">권한 명령의 성공 여부가 아니라 최종적으로 가능한 작업과 남아 있는 모든 권한 경로를 확인합니다.</text>

  <rect x="90" y="100" width="1020" height="66" class="card principle"/>
  <text x="600" y="126" class="section">핵심 원칙</text>
  <text x="600" y="150" class="body">REVOKE는 특정 부여 경로만 제거할 수 있습니다. 직접 권한·역할 멤버십·PUBLIC·객체 소유권을 합쳐 유효 권한을 검증합니다.</text>

  <!-- Main flow -->
  <rect x="35" y="205" width="250" height="135" class="card policy"/>
  <circle cx="65" cy="235" r="15" fill="#3b82f6"/>
  <text x="65" y="240" class="step">1</text>
  <text x="160" y="242" class="head">정책과 대상 확인</text>
  <text x="160" y="273" class="body">역할 · 객체 · 권한 종류</text>
  <text x="160" y="297" class="body">허용 작업과 거부 작업</text>
  <text x="160" y="321" class="small">변경 전 기대 결과를 먼저 기록</text>

  <rect x="330" y="205" width="250" height="135" class="card change"/>
  <circle cx="360" cy="235" r="15" fill="#f97316"/>
  <text x="360" y="240" class="step">2</text>
  <text x="455" y="242" class="head">테스트 환경에서 변경</text>
  <text x="455" y="273" class="mono body">GRANT 또는 REVOKE</text>
  <text x="455" y="297" class="body">대상과 범위를 명시적으로 제한</text>
  <text x="455" y="321" class="small">운영 의존성을 확인하지 않은 일괄 회수 금지</text>

  <rect x="625" y="205" width="250" height="135" class="card paths"/>
  <circle cx="655" cy="235" r="15" fill="#8b5cf6"/>
  <text x="655" y="240" class="step">3</text>
  <text x="750" y="242" class="head">모든 권한 경로 조사</text>
  <text x="750" y="273" class="body">직접 부여 · 역할 상속</text>
  <text x="750" y="297" class="body">PUBLIC · 객체 소유권</text>
  <text x="750" y="321" class="small">한 경로의 REVOKE만으로 끝내지 않음</text>

  <rect x="920" y="205" width="245" height="135" class="card verify"/>
  <circle cx="950" cy="235" r="15" fill="#22c55e"/>
  <text x="950" y="240" class="step">4</text>
  <text x="1042" y="242" class="head">유효 권한 검증</text>
  <text x="1042" y="273" class="mono body">has_*_privilege</text>
  <text x="1042" y="297" class="body">허용·거부 작업 직접 실행</text>
  <text x="1042" y="321" class="small">권한 목록과 실제 동작을 함께 확인</text>

  <path d="M285 272.5 H330" class="line"/>
  <path d="M580 272.5 H625" class="line"/>
  <path d="M875 272.5 H920" class="line"/>

  <!-- Privilege paths -->
  <path d="M750 340 V375" class="connector"/>
  <text x="600" y="392" class="head">유효 권한을 만드는 네 가지 경로</text>
  <line x1="35" y1="410" x2="1165" y2="410" class="divider"/>

  <rect x="35" y="430" width="270" height="210" class="card direct"/>
  <text x="170" y="463" class="head">직접 권한</text>
  <text x="170" y="490" class="mono body">GRANT ... TO role</text>
  <rect x="60" y="515" width="220" height="72" class="detail"/>
  <text x="170" y="541" class="section">확인 근거</text>
  <text x="170" y="565" class="mono small">role_table_grants</text>
  <text x="170" y="614" class="small">해당 역할에 명시적으로 부여된 경로</text>

  <rect x="325" y="430" width="270" height="210" class="card membership"/>
  <text x="460" y="463" class="head">역할 멤버십</text>
  <text x="460" y="490" class="body">상위 NOLOGIN 역할에서 상속</text>
  <rect x="350" y="515" width="220" height="72" class="detail"/>
  <text x="460" y="541" class="section">확인 근거</text>
  <text x="460" y="565" class="mono small">pg_has_role · pg_roles</text>
  <text x="460" y="614" class="small">다른 역할을 통해 같은 권한이 남을 수 있음</text>

  <rect x="615" y="430" width="270" height="210" class="card public"/>
  <text x="750" y="463" class="head">PUBLIC</text>
  <text x="750" y="490" class="body">모든 역할에 공통 적용되는 경로</text>
  <rect x="640" y="515" width="220" height="72" class="detail"/>
  <text x="750" y="541" class="section">확인 대상</text>
  <text x="750" y="565" class="mono small">DATABASE · SCHEMA · TABLE</text>
  <text x="750" y="614" class="small">무조건 REVOKE하기 전 다른 서비스 의존성 확인</text>

  <rect x="905" y="430" width="260" height="210" class="card owner"/>
  <text x="1035" y="463" class="head">객체 소유권</text>
  <text x="1035" y="490" class="body">일반 권한과 별도의 강한 제어 권한</text>
  <rect x="930" y="515" width="210" height="72" class="detail"/>
  <text x="1035" y="541" class="section">확인 대상</text>
  <text x="1035" y="565" class="mono small">table owner · current_user</text>
  <text x="1035" y="614" class="small">앱 계정이 소유자이면 REVOKE만으로 제한하기 어려움</text>

  <!-- Verification -->
  <path d="M600 640 V675" class="connector"/>
  <text x="600" y="698" class="head">권한 목록과 실제 작업을 함께 검증</text>
  <line x1="35" y1="716" x2="1165" y2="716" class="divider"/>

  <rect x="35" y="735" width="350" height="145" class="card positive"/>
  <text x="210" y="768" class="head">긍정 테스트</text>
  <text x="210" y="797" class="body">정책상 허용된 SELECT·INSERT 등이 성공하는가?</text>
  <text x="210" y="823" class="body">CONNECT·USAGE·시퀀스 권한까지 실제 경로가 동작하는가?</text>
  <text x="210" y="852" class="small">필요 작업 성공도 권한 검증의 일부</text>

  <rect x="425" y="735" width="350" height="145" class="card negative"/>
  <text x="600" y="768" class="head">부정 테스트</text>
  <text x="600" y="797" class="body">정책상 거부된 INSERT·DELETE·CREATE가 실패하는가?</text>
  <text x="600" y="823" class="body">REVOKE 후 다른 경로로 여전히 실행되지 않는가?</text>
  <text x="600" y="852" class="small">예상된 권한 오류도 중요한 테스트 증거</text>

  <rect x="815" y="735" width="350" height="145" class="card evidence"/>
  <text x="990" y="768" class="head">메타데이터 증거</text>
  <text x="990" y="797" class="mono body">has_database_privilege</text>
  <text x="990" y="821" class="mono body">has_schema_privilege · has_table_privilege</text>
  <text x="990" y="846" class="small">명시적 목록·멤버십·PUBLIC·소유권 결과를 함께 기록</text>

  <!-- Decision -->
  <path d="M600 880 V910" class="line"/>
  <rect x="270" y="910" width="660" height="88" class="card decision"/>
  <text x="600" y="943" class="head">허용 작업은 성공하고 거부 작업은 실패하며</text>
  <text x="600" y="972" class="head">최종 유효 권한이 정책과 일치하는가?</text>

  <path d="M600 998 V1023" class="connector"/>
  <path d="M600 1023 H275 V1047" class="line"/>
  <path d="M600 1023 H925 V1047" class="line"/>
  <text x="420" y="1016" class="label no">아니요</text>
  <text x="780" y="1016" class="label yes">예</text>

  <rect x="60" y="1047" width="430" height="62" class="card revise"/>
  <text x="275" y="1073" class="head">남은 권한 경로 조정·재검증</text>
  <text x="275" y="1096" class="small">직접 권한·멤버십·PUBLIC·소유권 중 원인을 찾아 최소 범위로 수정</text>

  <rect x="710" y="1047" width="430" height="62" class="card success"/>
  <text x="925" y="1073" class="head">검증 완료·증거 기록</text>
  <text x="925" y="1096" class="small">변경 SQL·유효 권한 결과·긍정/부정 테스트·예외 근거 보존</text>

  <path d="M120 1047 V895 H210 V880" class="loop"/>
  <text x="190" y="918" class="small">같은 테스트 재실행</text>
</svg>