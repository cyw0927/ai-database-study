<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">3정규형: 비키 컬럼 간 의존 분리</title>
  <desc id="desc">member_id가 zip_code를 결정하고 zip_code가 city를 결정하는 의존 사슬에서 city를 zip_codes 테이블로 분리하는 구조와 단순화 가정을 보여 준다.</desc>

  <style>
    .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .sub { font-size: 15px; fill: #4b5563; }
    .h { font-size: 18px; font-weight: 700; }
    .b { font-size: 14px; }
    .s { font-size: 12.5px; }
    .box { stroke: #64748b; stroke-width: 1.7; rx: 14; ry: 14; }
    .problem { fill: #fff1f1; }
    .insert { fill: #fff6d8; }
    .update { fill: #ffeaea; }
    .delete { fill: #f3edff; }
    .nf1 { fill: #eaf3ff; }
    .nf2 { fill: #fff0df; }
    .nf3 { fill: #f2ecff; }
    .good { fill: #eaf8ee; }
    .review { fill: #eaf3ff; }
    .ai { fill: #f2ecff; }
    .note { fill: #fff6d8; }
    .pk { fill: #1d4ed8; font-weight: 700; }
    .fk { fill: #c2410c; font-weight: 700; }
    .line { stroke: #475569; stroke-width: 2; fill: none; }
    .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    .hot { fill: #b91c1c; font-weight: 700; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="ko title">3정규형: 비키 컬럼 간 의존 분리</text>

  <text x="600" y="72" text-anchor="middle" class="ko sub">전제: 먼저 2NF를 만족하며, 이 예제에서는 zip_code 하나가 city 하나를 결정한다고 가정합니다.</text>
  <rect x="70" y="125" width="380" height="260" class="box problem"/>
  <text x="260" y="165" text-anchor="middle" class="ko h">정규화 전 members</text>
  <text x="125" y="220" class="mono b pk">member_id PK</text>
  <text x="125" y="260" class="mono b">member_name</text>
  <text x="125" y="300" class="mono b">zip_code</text>
  <text x="125" y="340" class="mono b hot">city</text>
  <rect x="485" y="170" width="230" height="150" class="box note"/>
  <text x="600" y="215" text-anchor="middle" class="mono h">member_id → zip_code</text>
  <text x="600" y="255" text-anchor="middle" class="mono h">zip_code → city</text>
  <text x="600" y="295" text-anchor="middle" class="ko b">city는 zip_code에 직접 의존</text>
  <line x1="715" y1="245" x2="780" y2="245" class="line" marker-end="url(#arrow)"/>
  <rect x="790" y="110" width="340" height="180" class="box nf3"/>
  <text x="960" y="150" text-anchor="middle" class="mono h">members</text>
  <text x="850" y="200" class="mono b pk">id PK</text><text x="850" y="235" class="mono b">name</text><text x="850" y="270" class="mono b fk">zip_code FK</text>
  <rect x="790" y="330" width="340" height="150" class="box nf3"/>
  <text x="960" y="370" text-anchor="middle" class="mono h">zip_codes</text>
  <text x="850" y="420" class="mono b pk">zip_code PK</text><text x="850" y="455" class="mono b">city</text>
  <line x1="960" y1="290" x2="960" y2="330" class="dash" marker-end="url(#arrow)"/>
  <rect x="170" y="520" width="860" height="55" class="box good"/>
  <text x="600" y="553" text-anchor="middle" class="ko b">단순 반복이 아니라 비키 컬럼 간 결정 관계라는 업무 규칙을 확인한 뒤 분리합니다.</text>
</svg>
