<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">정규화된 저장과 JOIN 조회</title>
  <desc id="desc">members, books, loans에 사실을 한 번씩 저장하고 PK와 FK를 따라 JOIN하여 회원 이름, 책 제목, 대여일, 반납예정일을 조회하는 흐름을 보여 준다.</desc>

  <style>
    .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .sub { font-size: 15px; fill: #4b5563; }
    .h { font-size: 18px; font-weight: 700; }
    .b { font-size: 14px; }
    .s { font-size: 12.5px; }
    .box { stroke: #64748b; stroke-width: 1.7; rx: 14; ry: 14; }
    .problem { fill: #fff1f1; }
    .insert { fill: #fff6d8; }
    .update { fill: #ffeaea; }
    .delete { fill: #f3edff; }
    .nf1 { fill: #eaf3ff; }
    .nf2 { fill: #fff0df; }
    .nf3 { fill: #f2ecff; }
    .good { fill: #eaf8ee; }
    .review { fill: #eaf3ff; }
    .ai { fill: #f2ecff; }
    .note { fill: #fff6d8; }
    .pk { fill: #1d4ed8; font-weight: 700; }
    .fk { fill: #c2410c; font-weight: 700; }
    .line { stroke: #475569; stroke-width: 2; fill: none; }
    .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    .hot { fill: #b91c1c; font-weight: 700; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="ko title">정규화된 저장과 JOIN 조회</text>

  <text x="600" y="72" text-anchor="middle" class="ko sub">정규화는 저장 시 사실을 분리하고, JOIN은 조회 시 필요한 결과 집합을 만듭니다.</text>
  <rect x="70" y="120" width="260" height="150" class="box nf1"/>
  <text x="200" y="160" text-anchor="middle" class="mono h">members</text><text x="200" y="205" text-anchor="middle" class="ko b">회원 정보 한 번 저장</text>
  <rect x="70" y="315" width="260" height="150" class="box nf1"/>
  <text x="200" y="355" text-anchor="middle" class="mono h">books</text><text x="200" y="400" text-anchor="middle" class="ko b">도서 정보 한 번 저장</text>
  <rect x="400" y="218" width="260" height="170" class="box good"/>
  <text x="530" y="258" text-anchor="middle" class="mono h">loans</text><text x="530" y="300" text-anchor="middle" class="ko b">대여 정보와 두 FK 저장</text><text x="530" y="340" text-anchor="middle" class="mono b fk">member_id · book_id</text>
  <line x1="330" y1="195" x2="400" y2="270" class="dash" marker-end="url(#arrow)"/><line x1="330" y1="390" x2="400" y2="335" class="dash" marker-end="url(#arrow)"/>
  <line x1="660" y1="303" x2="790" y2="303" class="line" marker-end="url(#arrow)"/>
  <text x="725" y="280" text-anchor="middle" class="ko b">PK·FK를 따라 JOIN</text>
  <rect x="800" y="160" width="330" height="285" class="box note"/>
  <text x="965" y="200" text-anchor="middle" class="ko h">조회 결과</text>
  <text x="855" y="255" class="ko b">회원 이름</text><text x="855" y="295" class="ko b">책 제목</text><text x="855" y="335" class="ko b">대여일</text><text x="855" y="375" class="ko b">반납예정일</text>
  <rect x="125" y="510" width="430" height="75" class="box problem"/>
  <text x="340" y="540" text-anchor="middle" class="ko h">정규화 전</text><text x="340" y="567" text-anchor="middle" class="ko b">조회는 단순해 보이지만 중복과 이상 현상 위험</text>
  <rect x="645" y="510" width="430" height="75" class="box good"/>
  <text x="860" y="540" text-anchor="middle" class="ko h">정규화 후</text><text x="860" y="567" text-anchor="middle" class="ko b">JOIN 필요, 중복 감소와 변경 안정성 향상</text>
</svg>
