<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">중복 저장이 만드는 정규화 문제</title>
  <desc id="desc">회원, 책, 대여 사실이 한 테이블에 섞여 같은 사실이 반복되고 삽입, 수정, 삭제 문제로 이어져 테이블 분리 검토가 필요함을 보여 준다.</desc>

  <style>
    .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .sub { font-size: 15px; fill: #4b5563; }
    .h { font-size: 18px; font-weight: 700; }
    .b { font-size: 14px; }
    .s { font-size: 12.5px; }
    .box { stroke: #64748b; stroke-width: 1.7; rx: 14; ry: 14; }
    .problem { fill: #fff1f1; }
    .insert { fill: #fff6d8; }
    .update { fill: #ffeaea; }
    .delete { fill: #f3edff; }
    .nf1 { fill: #eaf3ff; }
    .nf2 { fill: #fff0df; }
    .nf3 { fill: #f2ecff; }
    .good { fill: #eaf8ee; }
    .review { fill: #eaf3ff; }
    .ai { fill: #f2ecff; }
    .note { fill: #fff6d8; }
    .pk { fill: #1d4ed8; font-weight: 700; }
    .fk { fill: #c2410c; font-weight: 700; }
    .line { stroke: #475569; stroke-width: 2; fill: none; }
    .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    .hot { fill: #b91c1c; font-weight: 700; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="ko title">중복 저장이 만드는 정규화 문제</text>

  <text x="600" y="72" text-anchor="middle" class="ko sub">중복의 핵심 문제는 저장 공간보다 값이 어긋날 위험입니다.</text>
  <!-- 정규화 전 샘플 -->
  <rect x="70" y="110" width="1060" height="230" class="box problem"/>
  <text x="600" y="145" text-anchor="middle" class="ko h">library_records · 회원·책·대여 사실 혼합</text>
  <rect x="105" y="175" width="300" height="125" class="box" fill="#ffffff"/>
  <text x="255" y="205" text-anchor="middle" class="ko b">loan 1</text>
  <text x="255" y="238" text-anchor="middle" class="ko b hot">김민지 · minji@example.com</text>
  <text x="255" y="270" text-anchor="middle" class="ko b hot">데이터베이스 입문 · 문길래</text>
  <rect x="450" y="175" width="300" height="125" class="box" fill="#ffffff"/>
  <text x="600" y="205" text-anchor="middle" class="ko b">loan 2</text>
  <text x="600" y="238" text-anchor="middle" class="ko b hot">김민지 · minji@example.com</text>
  <text x="600" y="270" text-anchor="middle" class="ko b">SQL 기초 · 홍길동</text>
  <rect x="795" y="175" width="300" height="125" class="box" fill="#ffffff"/>
  <text x="945" y="205" text-anchor="middle" class="ko b">loan 3</text>
  <text x="945" y="238" text-anchor="middle" class="ko b">이준호 · junho@example.com</text>
  <text x="945" y="270" text-anchor="middle" class="ko b hot">데이터베이스 입문 · 문길래</text>
  <line x1="600" y1="340" x2="600" y2="395" class="line" marker-end="url(#arrow)"/>
  <rect x="365" y="405" width="470" height="70" class="box note"/>
  <text x="600" y="434" text-anchor="middle" class="ko h">같은 사실이 여러 행에 반복</text>
  <text x="600" y="459" text-anchor="middle" class="ko b">회원·책·대여의 수명과 변경 이유가 서로 다름</text>
  <line x1="600" y1="475" x2="600" y2="515" class="line" marker-end="url(#arrow)"/>
  <rect x="90" y="525" width="300" height="70" class="box insert"/>
  <text x="240" y="555" text-anchor="middle" class="ko h">삽입 문제</text><text x="240" y="580" text-anchor="middle" class="ko b">대여 없이 책만 등록하기 어려움</text>
  <rect x="450" y="525" width="300" height="70" class="box update"/>
  <text x="600" y="555" text-anchor="middle" class="ko h">수정 문제</text><text x="600" y="580" text-anchor="middle" class="ko b">여러 행 수정 누락 시 값 불일치</text>
  <rect x="810" y="525" width="300" height="70" class="box delete"/>
  <text x="960" y="555" text-anchor="middle" class="ko h">삭제 문제</text><text x="960" y="580" text-anchor="middle" class="ko b">대여 삭제 시 책 정보도 소실</text>
  <text x="600" y="635" text-anchor="middle" class="ko h">정규화: 한 사실을 가능한 한 한 곳에서 관리하도록 테이블 경계를 다시 정한다.</text>
</svg>
