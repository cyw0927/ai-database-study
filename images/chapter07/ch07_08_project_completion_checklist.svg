<?xml version="1.0" encoding="utf-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  viewBox="0 0 1200 540"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">온라인 강의 DB 프로젝트 완성도 점검</title>
  <desc id="desc">요구사항부터 Chapter 08 인계까지 산출물이 서로 맞는지 확인하는 순차 점검 흐름</desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10Z" fill="#334155" />
    </marker>

    <style>
      text {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
        fill: #0f172a;
      }
      .title {
        font-size: 28px;
        font-weight: 700;
        text-anchor: middle;
      }
      .sub {
        font-size: 14px;
        fill: #475569;
        text-anchor: middle;
      }
      .box {
        fill: #ffffff;
        stroke: #8bbcf6;
        stroke-width: 2;
        rx: 14;
      }
      .green {
        fill: #f2fff8;
        stroke: #22a06b;
        stroke-width: 2;
        rx: 14;
      }
      .head {
        font-size: 18px;
        font-weight: 700;
        text-anchor: middle;
      }
      .body {
        font-size: 13.5px;
        text-anchor: middle;
        fill: #334155;
      }
      .arrow {
        stroke: #334155;
        stroke-width: 2.2;
        fill: none;
        marker-end: url(#arrow);
      }
      .note {
        fill: #eefdf4;
        stroke: #22c55e;
        stroke-width: 1.5;
        rx: 12;
      }
    </style>
  </defs>

  <rect width="1200" height="540" fill="#ffffff" />

  <text x="600" y="48" class="title">온라인 강의 DB 프로젝트 완성도 점검</text>
  <text x="600" y="76" class="sub">요구사항부터 Chapter 08 인계까지 산출물이 서로 맞는지 확인한다</text>

  <!-- Top row -->
  <rect x="85" y="135" width="210" height="105" class="box" />
  <text x="190" y="167" class="head">요구사항</text>
  <text x="190" y="193" class="body">핵심 규칙</text>

  <rect x="360" y="135" width="210" height="105" class="box" />
  <text x="465" y="167" class="head">ERD</text>
  <text x="465" y="193" class="body">PK · FK</text>

  <rect x="635" y="135" width="210" height="105" class="box" />
  <text x="740" y="167" class="head">SQL</text>
  <text x="740" y="193" class="body">실행 가능</text>

  <rect x="910" y="135" width="210" height="105" class="box" />
  <text x="1015" y="167" class="head">샘플</text>
  <text x="1015" y="193" class="body">4건 → 5건</text>

  <!-- Bottom row -->
  <rect x="85" y="285" width="210" height="105" class="green" />
  <text x="190" y="317" class="head">JOIN · CRUD</text>
  <text x="190" y="343" class="body">결과 검증</text>

  <rect x="360" y="285" width="210" height="105" class="green" />
  <text x="465" y="317" class="head">정규화</text>
  <text x="465" y="343" class="body">이상 현상</text>

  <rect x="635" y="285" width="210" height="105" class="green" />
  <text x="740" y="317" class="head">AI 검토</text>
  <text x="740" y="343" class="body">사람 판단</text>

  <rect x="910" y="285" width="210" height="105" class="green" />
  <text x="1015" y="317" class="head">인계</text>
  <text x="1015" y="343" class="body">Chapter 08</text>

  <!-- Snake-flow arrows aligned to card edges -->
  <path d="M295 187.5 H360" class="arrow" />
  <path d="M570 187.5 H635" class="arrow" />
  <path d="M845 187.5 H910" class="arrow" />
  <path d="M1015 240 V285" class="arrow" />
  <path d="M910 337.5 H845" class="arrow" />
  <path d="M635 337.5 H570" class="arrow" />
  <path d="M360 337.5 H295" class="arrow" />

  <rect x="270" y="430" width="660" height="54" class="note" />
  <text x="600" y="463" class="head">완성 기준은 문서가 아니라 요구사항을 재현하는 실행 가능한 근거다</text>
</svg>
