<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">요구사항을 데이터 구조로 바꾸기</title>
<desc id="desc">서비스 설명에서 엔터티, 속성, 관계, 제약조건을 도출한다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#fff;stroke:#8bbcf6;stroke-width:2;rx:14} .green{stroke:#22a06b;fill:#f2fff8} .orange{stroke:#f59e0b;fill:#fff8eb} .purple{stroke:#8b5cf6;fill:#f7f3ff} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#ef4444;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle} .pk{fill:#dbeafe;stroke:#2563eb;stroke-width:1.4} .fk{fill:#ffedd5;stroke:#f97316;stroke-width:1.4} .note{fill:#eefdf4;stroke:#22c55e;stroke-width:1.5;rx:12} .small{font-size:12.5px;text-anchor:middle;fill:#334155}
</style></defs>
<rect width="1200" height="430" fill="#ffffff"/>
<text x="600" y="48" class="title">요구사항을 데이터 구조로 바꾸기</text>
<text x="600" y="76" class="sub">서비스 설명에서 엔터티, 속성, 관계, 제약조건을 도출한다</text>
<rect x="70" y="145" width="180" height="145" class="box"/>
<text x="160.0" y="177" class="head">서비스 문장</text>
<text x="160.0" y="203" class="body">학생이 강의를</text>
<text x="160.0" y="225" class="body">수강신청한다</text>
<rect x="290" y="145" width="180" height="145" class="box"/>
<text x="380.0" y="177" class="head">엔터티</text>
<text x="380.0" y="203" class="body">students</text>
<text x="380.0" y="225" class="body">courses</text>
<rect x="510" y="145" width="180" height="145" class="orange"/>
<text x="600.0" y="177" class="head">관계</text>
<text x="600.0" y="203" class="body">enrollments</text>
<text x="600.0" y="225" class="body">관계 자체 정보</text>
<rect x="730" y="145" width="180" height="145" class="green"/>
<text x="820.0" y="177" class="head">속성</text>
<text x="820.0" y="203" class="body">status</text>
<text x="820.0" y="225" class="code">paid_amount</text>
<rect x="950" y="145" width="180" height="145" class="purple"/>
<text x="1040.0" y="177" class="head">테이블 설계</text>
<text x="1040.0" y="203" class="body">PK · FK</text>
<text x="1040.0" y="225" class="body">CHECK · UNIQUE</text>
<path d="M250 217 L290 217" class="arrow"/>
<path d="M470 217 L510 217" class="arrow"/>
<path d="M690 217 L730 217" class="arrow"/>
<path d="M910 217 L950 217" class="arrow"/>
<text x="600" y="365" class="head">명사는 후보, 동사는 관계와 규칙의 단서다</text>
</svg>
