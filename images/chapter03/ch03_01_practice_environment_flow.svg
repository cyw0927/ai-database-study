     id="desc">ChatGPT와 Codex가 초안과 오류 해석을 보조하고, 학습자가 검토한 SQL 파일을 DBeaver에서 실행해 PostgreSQL이 처리한다. 학습자는 결과를 검증하고 실패하면 수정해 재실행하며, SQL 파일과 검증 근거는 GitHub에 기록한다.</desc>
