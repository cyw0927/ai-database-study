<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">환경 조회와 자동 확인 흐름</title>
  <desc id="desc">setup_check.sql로 환경 정보를 조회한 뒤 데이터베이스, public 스키마, 권한과 쓰기 상태를 확인하고 setup_validate_local.sql로 권장 로컬 환경을 자동 확인하여 결과를 기록하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .check{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
      .run{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .decision{fill:#fffceb;stroke:#d6a600;stroke-width:2}
      .fix{fill:#fff1f1;stroke:#d64545;stroke-width:2}
      .record{fill:#f5f0ff;stroke:#7c4dcb;stroke-width:2}
      .name{font-size:18px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;text-anchor:middle;fill:#475569}
      .mono{font-size:14px;font-weight:700;text-anchor:middle;font-family:Consolas,D2Coding,"Courier New",monospace;fill:#0f2d5c}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#d64545;stroke-width:2.3;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label{font-size:16px;font-weight:700;text-anchor:middle}
      .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#fff"/>
  <text x="600" y="48" class="title">환경 조회와 자동 확인 흐름</text>

  <rect x="380" y="82" width="440" height="72" rx="14" class="check"/>
  <text x="600" y="111" class="name">setup_check.sql 실행</text>
  <text x="600" y="136" class="sub">환경 정보를 사람이 읽고 기록</text>

  <rect x="330" y="190" width="540" height="92" rx="14" class="check"/>
  <text x="600" y="220" class="name">기본 결과 확인</text>
  <text x="600" y="248" class="sub">DB · public · USAGE · transaction_read_only</text>
  <text x="600" y="270" class="mono">recommended_database_name_ok · public_schema_usage_ok</text>

  <rect x="390" y="318" width="420" height="70" rx="14" class="decision"/>
  <text x="600" y="348" class="name">조회 결과가 적절한가?</text>
  <text x="600" y="372" class="sub">연결·권한·쓰기 상태 확인</text>

  <rect x="70" y="445" width="320" height="76" rx="14" class="fix"/>
  <text x="230" y="474" class="name">환경 재확인</text>
  <text x="230" y="499" class="sub">연결·권한·read-only 확인</text>

  <rect x="400" y="445" width="400" height="76" rx="14" class="run"/>
  <text x="600" y="474" class="name">setup_validate_local.sql 실행</text>
  <text x="600" y="499" class="sub">권장 로컬 환경 자동 확인</text>

  <rect x="390" y="560" width="420" height="70" rx="14" class="decision"/>
  <text x="600" y="590" class="name">권장 조건을 통과하는가?</text>
  <text x="600" y="614" class="sub">로컬 환경 주요 조건 확인</text>

  <rect x="70" y="690" width="320" height="76" rx="14" class="fix"/>
  <text x="230" y="719" class="name">확인 항목 수정</text>
  <text x="230" y="744" class="sub">예외 메시지를 기준으로 재확인</text>

  <rect x="810" y="690" width="320" height="76" rx="14" class="record"/>
  <text x="970" y="719" class="name">통과 결과 기록</text>
  <text x="970" y="744" class="sub">필요할 때 두 파일 재실행</text>

  <path d="M600 154V190" class="line"/>
  <path d="M600 282V318" class="line"/>
  <path d="M500 388L390 483" class="loop"/>
  <text x="415" y="425" class="label" fill="#b42323">아니요</text>
  <path d="M600 388V445" class="line"/>
  <text x="635" y="421" class="label" fill="#166534">예</text>
  <path d="M600 521V560" class="line"/>
  <path d="M500 630L390 728" class="loop"/>
  <text x="415" y="668" class="label" fill="#b42323">아니요</text>
  <path d="M700 630L810 728" class="line"/>
  <text x="785" y="668" class="label" fill="#166534">예</text>
  <path d="M230 445V118H380" class="loop"/>
  <path d="M230 690V483H400" class="loop"/>

  <text x="600" y="850" class="note">두 파일은 테이블과 업무 데이터를 변경하지 않으므로 반복 실행할 수 있다.</text>
</svg>