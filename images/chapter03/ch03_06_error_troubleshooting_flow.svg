<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">데이터베이스 오류 해결 기본 흐름</title>
  <desc id="desc">하려던 작업과 전체 오류 메시지를 확인하고, 환경과 연결 상태를 점검한 뒤 오류 범주를 분류하여 한 번에 한 가지씩 수정하고 재실행하는 반복 절차</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .warn{fill:#fffceb;stroke:#d6a600;stroke-width:2}
      .fix{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
      .ok{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .bad{fill:#fff1f1;stroke:#d64545;stroke-width:2}
      .name{font-size:18px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;text-anchor:middle;fill:#475569}
      .tag{font-size:13px;font-weight:700;text-anchor:middle;fill:#334155}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#d64545;stroke-width:2.3;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label{font-size:16px;font-weight:700;text-anchor:middle}
      .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="600" y="48" class="title">데이터베이스 오류 해결 기본 흐름</text>

  <rect x="420" y="80" width="360" height="58" rx="14" class="box"/><text x="600" y="116" class="name">하려던 작업 정리</text>
  <rect x="420" y="168" width="360" height="58" rx="14" class="warn"/><text x="600" y="204" class="name">전체 오류 메시지 확인</text>
  <rect x="420" y="256" width="360" height="58" rx="14" class="box"/><text x="600" y="292" class="name">현재 환경과 연결 상태 확인</text>
  <rect x="330" y="344" width="540" height="78" rx="14" class="warn"/>
  <text x="600" y="373" class="name">오류 범주 분류</text>
  <text x="600" y="399" class="tag">연결·네트워크 · 인증·권한 · DB·스키마 · SQL·제약조건 · 도구·설치</text>
  <rect x="420" y="452" width="360" height="58" rx="14" class="fix"/><text x="600" y="488" class="name">가능성이 높은 원인부터 확인</text>
  <rect x="420" y="540" width="360" height="58" rx="14" class="fix"/><text x="600" y="576" class="name">한 번에 한 가지 수정</text>
  <rect x="420" y="628" width="360" height="58" rx="14" class="fix"/><text x="600" y="664" class="name">같은 작업 재실행</text>
  <rect x="840" y="628" width="240" height="58" rx="14" class="ok"/><text x="960" y="664" class="name">원인과 해결 방법 기록</text>
  <rect x="120" y="628" width="240" height="58" rx="14" class="bad"/><text x="240" y="664" class="name">새 증거로 다시 분류</text>

  <path d="M600 138V168" class="line"/><path d="M600 226V256" class="line"/>
  <path d="M600 314V344" class="line"/><path d="M600 422V452" class="line"/>
  <path d="M600 510V540" class="line"/><path d="M600 598V628" class="line"/>
  <path d="M780 657H840" class="line"/><text x="810" y="643" class="label" fill="#166534">예</text>
  <path d="M420 657H360" class="loop"/><text x="390" y="643" class="label" fill="#b42323">아니요</text>
  <path d="M240 628V383H330" class="loop"/>
  <text x="600" y="745" class="note">오류가 사라졌는지보다 원래 목표가 완료되었는지 확인한다.</text>
  <text x="600" y="772" class="sub">예상한 UNIQUE/FK 오류는 정상 검증 결과일 수 있다.</text>
</svg>
