<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT와 Codex를 활용한 실습 보조 흐름</title>
  <desc id="desc">목표와 오류를 정리한 뒤 필요한 도움에 따라 ChatGPT 또는 Codex를 활용하고, AI 결과를 검토·실행·비교하여 채택하거나 다시 요청하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .decide{fill:#fffceb;stroke:#d6a600;stroke-width:2}
      .chat{fill:#fff5df;stroke:#d89424;stroke-width:2}
      .codex{fill:#f5f0ff;stroke:#7c4dcb;stroke-width:2}
      .run{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
      .ok{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .bad{fill:#fff1f1;stroke:#d64545;stroke-width:2}
      .name{font-size:18px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;text-anchor:middle;fill:#475569}
      .tag{font-size:14px;font-weight:700;text-anchor:middle;fill:#334155}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#d64545;stroke-width:2.3;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label{font-size:16px;font-weight:700;text-anchor:middle}
      .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="600" y="48" class="title">ChatGPT와 Codex를 활용한 실습 보조 흐름</text>

  <rect x="420" y="82" width="360" height="58" rx="14" class="box"/><text x="600" y="118" class="name">목표·현재 상태·오류 정리</text>
  <rect x="420" y="175" width="360" height="66" rx="14" class="decide"/>
  <text x="600" y="203" class="name">어떤 도움이 필요한가?</text>
  <text x="600" y="226" class="sub">설명 보조 또는 파일 작성 보조</text>

  <rect x="120" y="295" width="300" height="80" rx="14" class="chat"/>
  <text x="270" y="327" class="name">ChatGPT</text>
  <text x="270" y="352" class="sub">오류 해석·개념 설명 보조</text>
  <rect x="780" y="295" width="300" height="80" rx="14" class="codex"/>
  <text x="930" y="327" class="name">Codex</text>
  <text x="930" y="352" class="sub">SQL·문서 파일 초안 보조</text>

  <rect x="365" y="430" width="470" height="78" rx="14" class="decide"/>
  <text x="600" y="459" class="name">AI 결과 검토</text>
  <text x="600" y="485" class="tag">가정 · 위험 · 민감정보 · 변경 범위</text>
  <rect x="420" y="545" width="360" height="58" rx="14" class="run"/><text x="600" y="581" class="name">실습 환경에서 직접 실행</text>
  <rect x="420" y="635" width="360" height="58" rx="14" class="run"/><text x="600" y="671" class="name">예상 결과와 실제 결과 비교</text>
  <rect x="830" y="635" width="250" height="58" rx="14" class="ok"/><text x="955" y="671" class="name">채택한 내용과 근거 기록</text>
  <rect x="120" y="635" width="250" height="58" rx="14" class="bad"/><text x="245" y="671" class="name">질문·요청 수정</text>

  <path d="M600 140V175" class="line"/>
  <path d="M480 241L330 295" class="line"/><text x="385" y="252" class="label" fill="#92400e">오류 해석</text>
  <path d="M720 241L870 295" class="line"/><text x="815" y="252" class="label" fill="#5b3a96">파일 작성</text>
  <path d="M270 375L515 430" class="line"/><path d="M930 375L685 430" class="line"/>
  <path d="M600 508V545" class="line"/><path d="M600 603V635" class="line"/>
  <path d="M780 664H830" class="line"/><text x="805" y="650" class="label" fill="#166534">일치</text>
  <path d="M420 664H370" class="loop"/><text x="395" y="650" class="label" fill="#b42323">불일치</text>
  <path d="M245 635V111H420" class="loop"/>
  <text x="600" y="750" class="note">비밀번호와 전체 접속 문자열은 입력에서 제외하고, 최종 판단은 실행 결과를 기준으로 한다.</text>
</svg>
