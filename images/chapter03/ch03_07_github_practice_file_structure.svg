<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SQL 실습 파일과 GitHub 기록 흐름</title>
  <desc id="desc">code/chapter03의 setup_check.sql과 README.md를 중심으로 SQL 실행 결과를 확인하고 비밀정보를 제외한 뒤 GitHub에 기록하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .tree{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
      .file{fill:#fff;stroke:#64748b;stroke-width:2}
      .dbeaver{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
      .pg{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .github{fill:#f5f0ff;stroke:#7c4dcb;stroke-width:2}
      .warn{fill:#fffceb;stroke:#d6a600;stroke-width:2}
      .name{font-size:18px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;text-anchor:middle;fill:#475569}
      .mono{font-size:14px;text-anchor:middle;font-family:Consolas,D2Coding,"Courier New",monospace;fill:#0f2d5c}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="48" class="title">SQL 실습 파일과 GitHub 기록 흐름</text>

  <rect x="95" y="110" width="330" height="210" rx="16" class="tree"/>
  <text x="260" y="145" class="name">ai-database-book/</text>
  <text x="260" y="180" class="mono">code/chapter03/</text>
  <text x="260" y="215" class="mono">setup_check.sql</text>
  <text x="260" y="245" class="mono">README.md</text>
  <text x="260" y="285" class="sub">DB 데이터 자체가 아니라</text>
  <text x="260" y="305" class="sub">재현 가능한 SQL과 기록을 저장</text>

  <rect x="525" y="95" width="300" height="58" rx="14" class="file"/><text x="675" y="131" class="name">setup_check.sql 수정</text>
  <rect x="525" y="185" width="300" height="58" rx="14" class="dbeaver"/><text x="675" y="221" class="name">DBeaver에서 실행</text>
  <rect x="525" y="275" width="300" height="58" rx="14" class="pg"/><text x="675" y="311" class="name">PostgreSQL 결과·오류 확인</text>
  <rect x="525" y="365" width="300" height="72" rx="14" class="file"/>
  <text x="675" y="394" class="name">README 기록</text>
  <text x="675" y="419" class="sub">실행 방법과 결과를 실제와 맞춤</text>
  <rect x="525" y="470" width="300" height="58" rx="14" class="warn"/><text x="675" y="506" class="name">비밀정보 확인</text>
  <rect x="525" y="560" width="300" height="58" rx="14" class="github"/><text x="675" y="596" class="name">작은 단위로 GitHub 커밋</text>

  <path d="M425 215H525" class="line"/>
  <path d="M675 153V185" class="line"/><path d="M675 243V275" class="line"/>
  <path d="M675 333V365" class="line"/><path d="M675 437V470" class="line"/>
  <path d="M675 528V560" class="line"/>
  <text x="600" y="682" class="note">비밀번호와 실제 .env는 저장하지 않고, SQL과 README가 실행 결과와 일치하는지 확인한다.</text>
</svg>
