<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">JOIN 관계와 외래키 인덱스 후보</title>
  <desc id="desc">부모 기본키에는 자동 인덱스가 있지만 PostgreSQL의 자식 외래키 컬럼에는 자동 인덱스가 없으므로 반복 JOIN과 WHERE, 선택도, 쓰기 비용과 실행 계획을 검토해 수동 인덱스 후보 또는 보류로 판단하는 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#0f172a}
      .title{font-size:32px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .sub{font-size:15px;fill:#475569;text-anchor:middle}
      .section-title{font-size:18px;font-weight:700;text-anchor:middle}
      .head{font-size:18px;font-weight:700;text-anchor:middle}
      .body{font-size:14px;text-anchor:middle;fill:#334155}
      .small{font-size:13px;text-anchor:middle;fill:#475569}
      .tag{font-size:13px;font-weight:700;text-anchor:middle;fill:#2563eb}
      .group{stroke:#cbd5e1;stroke-width:1.6;rx:18;ry:18}
      .parent-group{fill:#f0fdf4}
      .child-group{fill:#fff1f2}
      .card{stroke-width:2;rx:14;ry:14}
      .pk{fill:#ecfdf5;stroke:#22c55e}
      .fk{fill:#fdf2f8;stroke:#db2777}
      .decision{fill:#eff6ff;stroke:#2563eb}
      .candidate{fill:#ecfdf5;stroke:#16a34a}
      .hold{fill:#fff7ed;stroke:#f97316}
      .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6;rx:14;ry:14}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#334155;stroke-width:2.2;fill:none;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" class="title">JOIN 관계와 외래키 인덱스 후보</text>
  <text x="600" y="78" class="sub">FK 제약조건과 인덱스의 목적을 구분하고 실제 조회 패턴으로 판단합니다.</text>

  <rect x="40" y="115" width="250" height="425" class="group parent-group"/>
  <text x="165" y="152" class="section-title">부모 테이블</text>

  <rect x="65" y="175" width="200" height="120" class="card pk"/>
  <text x="165" y="212" class="head">students.id</text>
  <text x="165" y="244" class="body">기본키(PK)</text>
  <text x="165" y="272" class="small">자동 인덱스 생성</text>

  <rect x="65" y="345" width="200" height="120" class="card pk"/>
  <text x="165" y="382" class="head">courses.id</text>
  <text x="165" y="414" class="body">기본키(PK)</text>
  <text x="165" y="442" class="small">자동 인덱스 생성</text>

  <rect x="335" y="115" width="300" height="425" class="group child-group"/>
  <text x="485" y="152" class="section-title">자식 테이블</text>

  <rect x="370" y="175" width="230" height="120" class="card fk"/>
  <text x="485" y="207" class="head">enrollments.student_id</text>
  <text x="485" y="239" class="body">외래키(FK) 자식 컬럼</text>
  <text x="485" y="267" class="small">PostgreSQL 자동 인덱스 없음</text>

  <rect x="370" y="345" width="230" height="120" class="card fk"/>
  <text x="485" y="377" class="head">enrollments.course_id</text>
  <text x="485" y="409" class="body">외래키(FK) 자식 컬럼</text>
  <text x="485" y="437" class="small">PostgreSQL 자동 인덱스 없음</text>

  <rect x="690" y="205" width="245" height="240" class="card decision"/>
  <text x="812.5" y="242" class="head">인덱스 후보 검토</text>
  <text x="812.5" y="282" class="body">반복 JOIN·WHERE인가?</text>
  <text x="812.5" y="315" class="body">선택도가 충분한가?</text>
  <text x="812.5" y="348" class="body">쓰기 비용은 감당 가능한가?</text>
  <text x="812.5" y="381" class="body">실행 계획에서 효과가 있는가?</text>
  <text x="812.5" y="416" class="small">후보 선정 뒤 적용 전·후 비교</text>

  <rect x="970" y="190" width="210" height="110" class="card candidate"/>
  <text x="1075" y="230" class="head">수동 인덱스 후보</text>
  <text x="1075" y="264" class="body">DDL 작성·재검증</text>
  <text x="1075" y="288" class="small">운영 반영 전 테스트</text>

  <rect x="970" y="355" width="210" height="110" class="card hold"/>
  <text x="1075" y="395" class="head">보류</text>
  <text x="1075" y="429" class="body">효과 또는 근거 부족</text>
  <text x="1075" y="453" class="small">쓰기 비용 포함 재검토</text>

  <path d="M265 235H370" class="arrow"/>
  <text x="317.5" y="218" class="tag">참조</text>
  <path d="M265 405H370" class="arrow"/>
  <text x="317.5" y="388" class="tag">참조</text>

  <path d="M600 235H655V325H690" class="arrow"/>
  <path d="M600 405H655V325" class="connector"/>

  <path d="M935 325H952V245H970" class="arrow"/>
  <text x="954" y="220" class="tag">효과 확인</text>
  <path d="M952 325V410H970" class="arrow"/>
  <text x="956" y="448" class="tag">효과 불충분</text>

  <rect x="190" y="575" width="820" height="82" class="note"/>
  <text x="600" y="607" class="head">FK는 참조 무결성을 보장하고, 인덱스는 조회 성능을 지원합니다.</text>
  <text x="600" y="637" class="body">외래키가 있다는 이유만으로 만들지 말고 JOIN·WHERE와 실행 계획을 근거로 판단합니다.</text>
</svg>