<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">AI 추천 인덱스 검토 흐름</title>
  <desc id="desc">AI가 추천한 인덱스를 기존 인덱스와 비교해 중복 또는 불필요한 후보를 폐기하고, 남은 후보는 실제 반복 쿼리와 EXPLAIN ANALYZE BUFFERS 실행 계획을 적용 전후로 검증한 뒤 근거와 쓰기 비용에 따라 적용 후보 승인 또는 보류로 결정하는 흐름도</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f97316"/>
    </marker>

    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#0f172a}
      .title{font-size:32px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .head{font-size:18px;font-weight:700;text-anchor:middle}
      .body{font-size:14px;text-anchor:middle;fill:#334155}
      .small{font-size:13px;text-anchor:middle;fill:#475569}
      .code{font-family:Consolas,D2Coding,"Courier New",monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8}
      .step{font-size:14px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .branch{font-size:14px;font-weight:700;text-anchor:middle}
      .branch-blue{fill:#1d4ed8}.branch-pink{fill:#be185d}.branch-green{fill:#15803d}.branch-orange{fill:#c2410c}
      .card{stroke-width:2;rx:14;ry:14}
      .ai{fill:#f5f3ff;stroke:#8b5cf6}
      .review{fill:#eff6ff;stroke:#2563eb}
      .decision{fill:#ffffff;stroke:#2563eb;stroke-width:2}
      .discard{fill:#fdf2f8;stroke:#db2777}
      .verify{fill:#ecfdf5;stroke:#22c55e}
      .apply{fill:#dcfce7;stroke:#16a34a}
      .hold{fill:#fff7ed;stroke:#f97316}
      .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6;rx:14;ry:14}
      .branch-label{fill:#ffffff;stroke:#cbd5e1;stroke-width:1;rx:9;ry:9}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .arrow-blue{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#arrow-blue);stroke-linejoin:round}
      .arrow-pink{stroke:#db2777;stroke-width:2.4;fill:none;marker-end:url(#arrow-pink);stroke-linejoin:round}
      .arrow-green{stroke:#16a34a;stroke-width:2.4;fill:none;marker-end:url(#arrow-green);stroke-linejoin:round}
      .arrow-orange{stroke:#f97316;stroke-width:2.4;fill:none;marker-end:url(#arrow-orange);stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1200" height="1320" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="48" class="title">AI 추천 인덱스 검토 흐름</text>
  <text x="600" y="78" class="subtitle">추천을 바로 적용하지 않고 기존 구조, 반복 쿼리, 실행 계획과 쓰기 비용을 차례로 검증합니다.</text>

  <!-- Unified principle -->
  <rect x="100" y="105" width="1000" height="78" class="note"/>
  <text x="600" y="134" class="head">핵심 원칙</text>
  <text x="600" y="160" class="body">최종 판단은 AI의 설명이 아니라 실제 스키마, 반복 쿼리와 적용 전후 실행 계획 측정 결과를 근거로 합니다.</text>

  <!-- Stage 1 and duplicate review -->
  <rect x="50" y="230" width="190" height="120" class="card ai"/>
  <circle cx="80" cy="260" r="17" fill="#8b5cf6"/>
  <text x="80" y="265" class="step">1</text>
  <text x="145" y="272" class="head">AI 추천</text>
  <text x="145" y="304" class="body">인덱스 후보 초안</text>
  <text x="145" y="332" class="code">CREATE INDEX ...</text>

  <rect x="300" y="230" width="230" height="120" class="card review"/>
  <circle cx="330" cy="260" r="17" fill="#2563eb"/>
  <text x="330" y="265" class="step">2</text>
  <text x="415" y="272" class="head">기존 인덱스 확인</text>
  <text x="415" y="304" class="body">PK · UNIQUE · 수동 인덱스</text>
  <text x="415" y="332" class="small">컬럼·순서·조건과 목적 비교</text>

  <polygon points="700,195 860,290 700,385 540,290" class="decision"/>
  <rect x="664" y="172" width="72" height="28" rx="14" fill="#2563eb"/>
  <text x="700" y="191" class="step">3단계</text>
  <text x="700" y="262" class="head">중복되거나</text>
  <text x="700" y="290" class="head">기존 인덱스로</text>
  <text x="700" y="318" class="head">충분한가?</text>
  <text x="700" y="348" class="small">동일·포함·유사 목적 검토</text>

  <rect x="920" y="230" width="230" height="120" class="card discard"/>
  <text x="1035" y="272" class="head">추천 폐기</text>
  <text x="1035" y="304" class="body">새 인덱스를 만들지 않음</text>
  <text x="1035" y="332" class="small">기존 인덱스 삭제가 아님</text>

  <!-- First-row connectors -->
  <path d="M240 290 H300" class="arrow"/>
  <path d="M530 290 H540" class="arrow"/>
  <path d="M860 290 H920" class="arrow-pink"/>
  <rect x="865" y="250" width="108" height="24" class="branch-label"/>
  <text x="919" y="267" class="branch branch-pink">중복·불필요</text>

  <path d="M700 385 V410 H600 V440" class="arrow-blue"/>
  <rect x="612" y="393" width="88" height="24" class="branch-label"/>
  <text x="656" y="410" class="branch branch-blue">추가 검토</text>

  <!-- Query-pattern review -->
  <rect x="465" y="440" width="270" height="140" class="card review"/>
  <circle cx="495" cy="470" r="17" fill="#2563eb"/>
  <text x="495" y="475" class="step">4</text>
  <text x="600" y="482" class="head">쿼리 패턴 검토</text>
  <text x="600" y="514" class="body">WHERE · JOIN · ORDER BY · LIMIT</text>
  <text x="600" y="542" class="body">빈도 · 선택도 · 쓰기 비용</text>
  <text x="600" y="565" class="small">실제 반복 쿼리를 기준으로 판단</text>

  <path d="M600 580 V625" class="arrow"/>

  <!-- Plan verification -->
  <rect x="450" y="625" width="300" height="145" class="card verify"/>
  <circle cx="480" cy="655" r="17" fill="#22c55e"/>
  <text x="480" y="660" class="step">5</text>
  <text x="600" y="667" class="head">실행 계획 전후 비교</text>
  <text x="600" y="699" class="code">EXPLAIN (ANALYZE, BUFFERS)</text>
  <text x="600" y="729" class="body">비용 · 스캔 · 실제 행 수 · 실행 시간</text>
  <text x="600" y="752" class="small">동일 SQL과 동일 조건에서 적용 전후 비교</text>

  <path d="M600 770 V820" class="arrow"/>

  <!-- Final decision -->
  <polygon points="600,820 770,910 600,1000 430,910" class="decision"/>
  <rect x="564" y="792" width="72" height="28" rx="14" fill="#2563eb"/>
  <text x="600" y="811" class="step">6단계</text>
  <text x="600" y="872" class="head">개선 근거가 충분한가?</text>
  <text x="600" y="902" class="head">쓰기 비용과 운영 영향을</text>
  <text x="600" y="932" class="head">감당할 수 있는가?</text>
  <text x="600" y="962" class="small">성능과 운영 비용을 함께 판단</text>

  <!-- Same-level outcomes -->
  <path d="M600 1000 V1020 H380 V1050" class="arrow-green"/>
  <rect x="438" y="1004" width="96" height="24" class="branch-label"/>
  <text x="486" y="1021" class="branch branch-green">근거 충분</text>

  <path d="M600 1000 V1020 H820 V1050" class="arrow-orange"/>
  <rect x="666" y="1004" width="96" height="24" class="branch-label"/>
  <text x="714" y="1021" class="branch branch-orange">근거 부족</text>

  <rect x="230" y="1050" width="300" height="115" class="card apply"/>
  <text x="380" y="1088" class="head">적용 후보 승인</text>
  <text x="380" y="1118" class="body">운영 반영 전 충분한 테스트 수행</text>
  <text x="380" y="1143" class="small">배포·모니터링·롤백 계획 확인</text>

  <rect x="670" y="1050" width="300" height="115" class="card hold"/>
  <text x="820" y="1088" class="head">보류</text>
  <text x="820" y="1118" class="body">개선 근거 부족 또는 쓰기 비용 과다</text>
  <text x="820" y="1143" class="small">쿼리 패턴·통계·측정 결과 재확인</text>

  <!-- Review checklist -->
  <rect x="120" y="1200" width="960" height="90" class="note"/>
  <text x="600" y="1230" class="head">검토 체크포인트</text>
  <text x="600" y="1258" class="body">중복 인덱스 · 복합 인덱스 컬럼 순서 · 부분 인덱스 조건 · 읽기 이득과 쓰기 비용</text>
  <text x="600" y="1278" class="small">보류 후보는 쿼리·통계·측정 결과와 결정 근거를 기록해 필요할 때 다시 검토합니다.</text>
</svg>
