<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" role="img" aria-labelledby="title desc">
<title id="title">테이블, 행, 열과 셀의 구조</title><desc id="desc">students 표에서 1번 굵은 외곽선은 테이블 전체, 2번 긴 점선은 가로 행 전체, 3번 짧은 점선은 major 열 전체, 4번 굵은 보라색 선은 하나의 셀을 가리킨다</desc>
<style>text{font-family:"Malgun Gothic",sans-serif;fill:#172033}.title{font-size:30px;font-weight:800;text-anchor:middle}.head{fill:#e8f0ff}.cell{fill:#fff;stroke:#94a3b8;stroke-width:2}.row{fill:#fff7e8}.col{fill:#effaf3}.hit{fill:#f6f0ff;stroke:#7950b7;stroke-width:4}.table{fill:none;stroke:#155eef;stroke-width:6}.txt{font-size:20px;text-anchor:middle}.th{font-size:21px;font-weight:800;text-anchor:middle}.label{font-size:22px;font-weight:800}.sub{font-size:17px;fill:#526171}.num{fill:#172033}.nt{fill:#fff;font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.l1{stroke:#155eef;stroke-width:4;fill:none}.l2{stroke:#d97706;stroke-width:5;stroke-dasharray:15 7;fill:none}.l3{stroke:#16834a;stroke-width:5;stroke-dasharray:4 7;fill:none}.l4{stroke:#7950b7;stroke-width:6;fill:none}</style>
<rect width="1400" height="450" fill="#fff"/><text x="700" y="35" class="title">students 테이블에서 네 범위를 읽습니다</text>
<rect x="300" y="70" width="800" height="300" rx="8" class="table"/>
<rect x="300" y="70" width="140" height="60" class="cell head"/><rect x="440" y="70" width="180" height="60" class="cell head"/><rect x="620" y="70" width="300" height="60" class="cell head"/><rect x="920" y="70" width="180" height="60" class="cell head col"/>
<text x="370" y="108" class="th">id</text><text x="530" y="108" class="th">name</text><text x="770" y="108" class="th">email</text><text x="1010" y="108" class="th">major</text>
<g class="row"><rect x="300" y="130" width="140" height="80" class="cell row"/><rect x="440" y="130" width="180" height="80" class="cell row"/><rect x="620" y="130" width="300" height="80" class="cell row"/><rect x="920" y="130" width="180" height="80" class="hit"/></g>
<text x="370" y="178" class="txt">1</text><text x="530" y="178" class="txt">김민지</text><text x="770" y="178" class="txt">minji@example.com</text><text x="1010" y="178" class="txt">컴퓨터공학</text>
<rect x="300" y="210" width="140" height="80" class="cell"/><rect x="440" y="210" width="180" height="80" class="cell"/><rect x="620" y="210" width="300" height="80" class="cell"/><rect x="920" y="210" width="180" height="80" class="cell col"/>
<text x="370" y="258" class="txt">2</text><text x="530" y="258" class="txt">이준호</text><text x="770" y="258" class="txt">junho@example.com</text><text x="1010" y="258" class="txt">데이터사이언스</text>
<rect x="300" y="290" width="140" height="80" class="cell"/><rect x="440" y="290" width="180" height="80" class="cell"/><rect x="620" y="290" width="300" height="80" class="cell"/><rect x="920" y="290" width="180" height="80" class="cell col"/>
<text x="370" y="338" class="txt">3</text><text x="530" y="338" class="txt">박서연</text><text x="770" y="338" class="txt">seoyeon@example.com</text><text x="1010" y="338" class="txt">경영학</text>
<circle cx="70" cy="102" r="20" class="num"/><text x="70" y="102" class="nt">1</text><text x="105" y="99" class="label">테이블 전체</text><text x="105" y="125" class="sub">굵은 외곽선</text><path d="M225 105H300" class="l1"/>
<circle cx="70" cy="202" r="20" class="num"/><text x="70" y="202" class="nt">2</text><text x="105" y="199" class="label">행(Row)</text><text x="105" y="225" class="sub">가로 기록 전체</text><path d="M225 205H285V170H300" class="l2"/>
<circle cx="1160" cy="112" r="20" class="num"/><text x="1160" y="112" class="nt">3</text><text x="1195" y="109" class="label">열(Column)</text><text x="1195" y="135" class="sub">세로 항목 전체</text><path d="M1150 145H1120V220H1100" class="l3"/>
<circle cx="1160" cy="260" r="20" class="num"/><text x="1160" y="260" class="nt">4</text><text x="1195" y="257" class="label">셀(Cell)</text><text x="1195" y="283" class="sub">행과 열의 교차 값</text><path d="M1150 290H1125V170H1100" class="l4"/>
<text x="700" y="420" class="title" style="font-size:23px">students 한 행 = 학생 한 명</text>
</svg>
