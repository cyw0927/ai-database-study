<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DBMS, 데이터베이스, 테이블의 계층 구조</title>
  <desc id="desc">PostgreSQL DBMS 안에 여러 데이터베이스가 있고, 각 데이터베이스 안에 여러 테이블이 있는 계층 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .box{stroke-width:2.2;rx:14}
      .dbms{fill:#eef5ff;stroke:#3174d0}
      .database{fill:#fff5df;stroke:#d89424}
      .table{fill:#eef9f1;stroke:#2f9a58}
      .subdb{fill:#f8fafc;stroke:#94a3b8}
      .name{font-size:22px;font-weight:700;text-anchor:middle}
      .role{font-size:15px;font-weight:700;text-anchor:middle;fill:#475569}
      .small{font-size:15px;text-anchor:middle;fill:#334155}
      .note{font-size:17px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fff"/>
  <text x="600" y="48" class="title">DBMS, 데이터베이스, 테이블의 계층 구조</text>

  <rect x="405" y="86" width="390" height="86" class="box dbms"/>
  <text x="600" y="122" class="name">PostgreSQL</text>
  <text x="600" y="148" class="role">관계형 DBMS · 여러 데이터베이스를 관리</text>

  <path d="M600 172V218" class="line"/>
  <rect x="430" y="222" width="340" height="78" class="box database"/>
  <text x="600" y="254" class="name">school_db</text>
  <text x="600" y="279" class="role">하나의 데이터베이스</text>

  <path d="M600 300V352" class="line"/>
  <path d="M250 352H950" stroke="#475569" stroke-width="2.4" fill="none"/>
  <path d="M250 352V382" class="line"/>
  <path d="M600 352V382" class="line"/>
  <path d="M950 352V382" class="line"/>

  <rect x="130" y="386" width="240" height="82" class="box table"/>
  <text x="250" y="420" class="name">students</text>
  <text x="250" y="445" class="role">학생 테이블</text>

  <rect x="480" y="386" width="240" height="82" class="box table"/>
  <text x="600" y="420" class="name">courses</text>
  <text x="600" y="445" class="role">강의 테이블</text>

  <rect x="830" y="386" width="240" height="82" class="box table"/>
  <text x="950" y="420" class="name">enrollments</text>
  <text x="950" y="445" class="role">수강신청 테이블</text>

  <rect x="170" y="510" width="860" height="54" class="box subdb"/>
  <text x="600" y="543" class="small">다른 데이터베이스 예: shop_db 안에는 members · products · orders 테이블을 둘 수 있다.</text>
  <text x="600" y="596" class="note">하나의 DBMS는 여러 데이터베이스를, 하나의 데이터베이스는 여러 테이블을 관리한다.</text>
</svg>
