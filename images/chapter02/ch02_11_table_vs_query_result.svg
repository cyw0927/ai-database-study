<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">테이블과 조회 결과 비교</title><desc id="desc">students 원본 테이블의 네 열과 네 행에서 name과 major 열, 데이터사이언스 조건에 맞는 두 행만 선택되어 조회 결과가 되는 과정</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#155eef"/></marker><style>text{font-family:"Malgun Gothic",sans-serif;fill:#172033}.title{font-size:34px;font-weight:800;text-anchor:middle}.h{font-size:23px;font-weight:800;text-anchor:middle}.c{font-size:18px;text-anchor:middle}.box{fill:#fff;stroke:#64748b;stroke-width:3}.head{fill:#e8f0ff}.pick{fill:#effaf3}.line{stroke:#155eef;stroke-width:5;fill:none;marker-end:url(#a)}.note{font-size:18px;fill:#526171;text-anchor:middle}</style></defs>
<rect width="1400" height="650" fill="#fff"/><text x="700" y="48" class="title">저장 구조와 조회 결과는 다릅니다</text><text x="340" y="95" class="h">원본 테이블 students</text><text x="1060" y="95" class="h">조회 결과</text>
<g class="box"><rect x="70" y="120" width="540" height="360" fill="#fff"/><rect x="70" y="120" width="540" height="65" class="head"/><path d="M70 185H610M70 259H610M70 333H610M70 407H610M205 120V480M340 120V480M475 120V480" stroke="#94a3b8"/><rect x="205" y="259" width="270" height="74" class="pick"/><rect x="205" y="407" width="270" height="73" class="pick"/></g>
<text x="138" y="160" class="h">id</text><text x="273" y="160" class="h">name</text><text x="408" y="160" class="h">major</text><text x="543" y="160" class="h">active</text>
<text x="138" y="230" class="c">1</text><text x="273" y="230" class="c">김민지</text><text x="408" y="230" class="c">컴퓨터공학</text><text x="543" y="230" class="c">true</text>
<text x="138" y="304" class="c">2</text><text x="273" y="304" class="c">이준호</text><text x="408" y="304" class="c">데이터사이언스</text><text x="543" y="304" class="c">true</text>
<text x="138" y="378" class="c">3</text><text x="273" y="378" class="c">박서연</text><text x="408" y="378" class="c">경영학</text><text x="543" y="378" class="c">false</text>
<text x="138" y="452" class="c">4</text><text x="273" y="452" class="c">최유진</text><text x="408" y="452" class="c">데이터사이언스</text><text x="543" y="452" class="c">true</text>
<path d="M640 300H790" class="line"/><text x="715" y="270" class="note">열 선택 + 조건</text>
<g class="box"><rect x="820" y="180" width="510" height="220" fill="#fff"/><rect x="820" y="180" width="510" height="70" class="head"/><path d="M820 250H1330M820 325H1330M1075 180V400" stroke="#94a3b8"/></g><text x="948" y="225" class="h">name</text><text x="1203" y="225" class="h">major</text><text x="948" y="297" class="c">이준호</text><text x="1203" y="297" class="c">데이터사이언스</text><text x="948" y="372" class="c">최유진</text><text x="1203" y="372" class="c">데이터사이언스</text>
<text x="340" y="535" class="h">데이터를 저장하는 구조</text><text x="1060" y="535" class="h">SQL이 만든 결과 집합</text><text x="700" y="600" class="note">표처럼 보여도 조회 결과가 원본 테이블 전체라는 뜻은 아닙니다.</text>
</svg>
