<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">클라이언트와 PostgreSQL 요청·응답 흐름</title><desc id="desc">사용자가 SQL을 작성하면 DBeaver 같은 클라이언트가 PostgreSQL DBMS에 전달하고, 결과 또는 오류가 돌아와 사용자가 판단하는 흐름</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#155eef"/></marker><style>text{font-family:"Malgun Gothic",sans-serif;fill:#172033}.t{font-size:34px;font-weight:800;text-anchor:middle}.h{font-size:25px;font-weight:800;text-anchor:middle}.s{font-size:18px;text-anchor:middle;fill:#526171}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.client{fill:#e8f0ff;stroke:#155eef}.dbms{fill:#effaf3;stroke:#16834a}.human{fill:#fff7e8;stroke:#d97706}.line{fill:none;stroke:#155eef;stroke-width:5;marker-end:url(#a)}.return{stroke-dasharray:12 8}.num{fill:#172033}.nt{fill:#fff;font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle}</style></defs>
<rect width="1400" height="620" fill="#fff"/><text x="700" y="55" class="t">사용자와 PostgreSQL 사이의 요청·응답</text>
<g><rect x="45" y="180" width="240" height="180" rx="16" class="box human"/><circle cx="75" cy="205" r="18" class="num"/><text x="75" y="205" class="nt">1</text><text x="165" y="245" class="h">사용자</text><text x="165" y="285" class="s">질문 결정 · SQL 작성</text><text x="165" y="315" class="s">결과의 의미 판단</text></g>
<g><rect x="390" y="180" width="260" height="180" rx="16" class="box client"/><circle cx="420" cy="205" r="18" class="num"/><text x="420" y="205" class="nt">2</text><text x="520" y="245" class="h">클라이언트</text><text x="520" y="285" class="s">DBeaver · psql · 프로그램</text><text x="520" y="315" class="s">명령 전달 · 결과 표시</text></g>
<g><rect x="755" y="180" width="260" height="180" rx="16" class="box dbms"/><circle cx="785" cy="205" r="18" class="num"/><text x="785" y="205" class="nt">3</text><text x="885" y="245" class="h">PostgreSQL DBMS</text><text x="885" y="285" class="s">데이터 저장 · SQL 실행</text><text x="885" y="315" class="s">규칙 적용</text></g>
<g><rect x="1120" y="180" width="235" height="180" rx="16" class="box"/><circle cx="1150" cy="205" r="18" class="num"/><text x="1150" y="205" class="nt">4</text><text x="1238" y="245" class="h">결과 또는 오류</text><text x="1238" y="285" class="s">클라이언트 화면에 표시</text><text x="1238" y="315" class="s">사람이 최종 확인</text></g>
<path d="M285 235H390M650 235H755M1015 235H1120" class="line"/><path d="M1120 410H520V365" class="line return"/><text x="820" y="445" class="s">응답은 점선 경로로 돌아옵니다</text><text x="700" y="535" class="h">DBeaver는 전달하고, PostgreSQL은 실행하며, 사람은 의미를 판단합니다.</text>
</svg>
