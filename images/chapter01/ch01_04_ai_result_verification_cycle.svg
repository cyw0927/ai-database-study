  <title
     id="title">AI 생성 결과 검증 사이클</title>
  <desc
     id="desc">요구사항과 검증 기준을 정의하고 AI 초안을 생성한 뒤 사람이 사전 검토하고 격리된 환경에서 테스트한다. 예상 결과와 실제 결과를 비교해 검증 기준을 통과하면 결과와 근거를 기록하고, 미통과하면 수정 후 AI 초안 또는 사람 검토 단계로 돌아가는 반복 사이클</desc>
