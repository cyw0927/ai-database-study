<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">AI 기반 DB 설계 검증 전체 흐름</title>
  <desc id="desc">확인된 요구사항에서 AI 초안, 사람 검토, 실습 DB 실행과 증거 검증을 거쳐 불일치 시 수정하는 반복 흐름</desc>
  <style>
    .ko { font-family: "NanumSquare", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: "Noto Sans Mono CJK KR", "NanumSquare", Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4b5563; }
    .head { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; fill: #475569; }
    .box { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }
    .req { fill: #eaf3ff; }
    .ai { fill: #f3edff; }
    .human { fill: #fff6d8; }
    .codex { fill: #fff0dc; }
    .ok { fill: #eaf8ee; }
    .bad { fill: #ffeaea; }
    .meta { fill: #f1f5f9; }
    .line { stroke: #475569; stroke-width: 2; fill: none; }
    .loop { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="ko title"><tspan x="600" dy="0">AI 기반 DB 설계 검증 전체 흐름</tspan></text>
  <text x="600" y="72" text-anchor="middle" class="ko subtitle"><tspan x="600" dy="0">AI 초안은 요구사항과 실행 증거를 통과해야 검토된 설계가 됩니다.</tspan></text>
  <rect x="390" y="105" width="420" height="62" class="box req"/>
  <text x="600" y="141" text-anchor="middle" class="ko head"><tspan x="600" dy="0">1. 확인된 요구사항과 미확정 규칙</tspan></text>
  <rect x="390" y="195" width="420" height="62" class="box ai"/>
  <text x="600" y="231" text-anchor="middle" class="ko head"><tspan x="600" dy="0">2. AI ERD·DDL 초안</tspan></text>
  <rect x="390" y="285" width="420" height="62" class="box human"/>
  <text x="600" y="321" text-anchor="middle" class="ko head"><tspan x="600" dy="0">3. 요구사항 추적 검토</tspan></text>
  <rect x="390" y="375" width="420" height="86" class="box human"/>
  <text x="600" y="407" text-anchor="middle" class="ko body"><tspan x="600" dy="0">4. 사람의 설계 검토</tspan><tspan x="600" dy="22">관계 · 타입 · 제약조건 · 보안</tspan></text>
  <rect x="390" y="490" width="420" height="62" class="box codex"/>
  <text x="600" y="526" text-anchor="middle" class="ko head"><tspan x="600" dy="0">5. 실습 SQL 파일 수정</tspan></text>
  <rect x="390" y="580" width="420" height="62" class="box meta"/>
  <text x="600" y="616" text-anchor="middle" class="ko head"><tspan x="600" dy="0">6. 개인 실습 DB 실행</tspan></text>
  <line x1="600" y1="167" x2="600" y2="195" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="257" x2="600" y2="285" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="347" x2="600" y2="375" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="461" x2="600" y2="490" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="552" x2="600" y2="580" class="line" marker-end="url(#arrow)"/>
  <rect x="850" y="575" width="290" height="90" class="box human"/>
  <text x="995" y="609" text-anchor="middle" class="ko head"><tspan x="995" dy="0">요구사항·메타데이터·</tspan><tspan x="995" dy="22">결과가 일치하는가?</tspan></text>
  <line x1="810" y1="611" x2="850" y2="611" class="line" marker-end="url(#arrow)"/>
  <rect x="860" y="690" width="270" height="48" class="box ok"/>
  <text x="995" y="719" text-anchor="middle" class="ko body"><tspan x="995" dy="0">일치 → 근거와 최종 초안 기록</tspan></text>
  <line x1="995" y1="665" x2="995" y2="690" class="line" marker-end="url(#arrow)"/>
  <text x="1025" y="682" text-anchor="middle" class="ko small"><tspan x="1025" dy="0">일치</tspan></text>
  <rect x="60" y="580" width="270" height="76" class="box bad"/>
  <text x="195" y="612" text-anchor="middle" class="ko body"><tspan x="195" dy="0">불일치 → 원인 기록</tspan><tspan x="195" dy="22">요구사항 또는 설계 수정</tspan></text>
  <path d="M 850 620 C 700 700, 300 700, 195 656" class="loop" marker-end="url(#arrow)"/>
  <text x="600" y="700" text-anchor="middle" class="ko small"><tspan x="600" dy="0">불일치</tspan></text>
  <path d="M 195 580 C 195 515, 310 520, 390 521" class="loop" marker-end="url(#arrow)"/>
  <text x="275" y="535" text-anchor="middle" class="ko small"><tspan x="275" dy="0">수정 후 재실행</tspan></text>
</svg>
