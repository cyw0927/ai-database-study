<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">요구사항을 기준으로 ERD 검토하기</title>
  <desc id="desc">요구사항 기준선에서 엔터티, 관계, N대M, 외래키와 미확정 정책을 순서대로 검토하고 정책이 임의 고정되면 수정 후 반복하는 흐름</desc>
  <style>
    .ko { font-family: "NanumSquare", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }.subtitle { font-size: 14px; fill: #4b5563; }.head { font-size: 17px; font-weight: 700; }.body { font-size: 14px; }.small { font-size: 12px; fill: #475569; }
    .box { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }.req { fill: #eaf3ff; }.human { fill: #fff6d8; }.codex { fill: #fff0dc; }.ok { fill: #eaf8ee; }.bad { fill: #ffeaea; }.line { stroke: #475569; stroke-width: 2; fill: none; }.loop { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="ko title"><tspan x="600">요구사항을 기준으로 ERD 검토하기</tspan></text>
  <text x="600" y="72" text-anchor="middle" class="ko subtitle"><tspan x="600">AI 초안이 아니라 확인된 요구사항이 검토의 출발점입니다.</tspan></text>
  <rect x="390" y="110" width="420" height="58" class="box req"/><text x="600" y="144" text-anchor="middle" class="ko head"><tspan x="600">요구사항 기준선</tspan></text>
  <rect x="390" y="195" width="420" height="58" class="box human"/><text x="600" y="229" text-anchor="middle" class="ko head"><tspan x="600">엔터티 누락·임의 추가 확인</tspan></text>
  <rect x="390" y="280" width="420" height="58" class="box human"/><text x="600" y="314" text-anchor="middle" class="ko head"><tspan x="600">관계와 카디널리티 확인</tspan></text>
  <rect x="390" y="365" width="420" height="58" class="box human"/><text x="600" y="399" text-anchor="middle" class="ko head"><tspan x="600">N:M 중간 테이블 확인</tspan></text>
  <rect x="390" y="450" width="420" height="58" class="box human"/><text x="600" y="484" text-anchor="middle" class="ko head"><tspan x="600">FK 방향·필수 여부 확인</tspan></text>
  <line x1="600" y1="168" x2="600" y2="195" class="line" marker-end="url(#arrow)"/><line x1="600" y1="253" x2="600" y2="280" class="line" marker-end="url(#arrow)"/><line x1="600" y1="338" x2="600" y2="365" class="line" marker-end="url(#arrow)"/><line x1="600" y1="423" x2="600" y2="450" class="line" marker-end="url(#arrow)"/>
  <rect x="390" y="540" width="420" height="85" class="box human"/><text x="600" y="572" text-anchor="middle" class="ko head"><tspan x="600">미확정 정책이 UNIQUE·CASCADE로</tspan><tspan x="600" dy="22">고정되었는가?</tspan></text>
  <line x1="600" y1="508" x2="600" y2="540" class="line" marker-end="url(#arrow)"/>
  <rect x="855" y="550" width="275" height="60" class="box ok"/><text x="992" y="585" text-anchor="middle" class="ko body"><tspan x="992">아니요 → ERD·추적표 기록</tspan></text>
  <line x1="810" y1="583" x2="855" y2="583" class="line" marker-end="url(#arrow)"/><text x="835" y="565" text-anchor="middle" class="ko small"><tspan x="835">아니요</tspan></text>
  <rect x="60" y="545" width="270" height="70" class="box bad"/><text x="195" y="573" text-anchor="middle" class="ko body"><tspan x="195">예 → 가정 제거 또는</tspan><tspan x="195" dy="22">사람에게 결정 요청</tspan></text>
  <line x1="390" y1="583" x2="330" y2="583" class="line" marker-end="url(#arrow)"/><text x="360" y="565" text-anchor="middle" class="ko small"><tspan x="360">예</tspan></text>
  <rect x="60" y="660" width="270" height="50" class="box codex"/><text x="195" y="691" text-anchor="middle" class="ko head"><tspan x="195">ERD 수정</tspan></text>
  <line x1="195" y1="615" x2="195" y2="660" class="line" marker-end="url(#arrow)"/>
  <path d="M 195 660 C 195 500, 300 225, 390 224" class="loop" marker-end="url(#arrow)"/><text x="240" y="430" text-anchor="middle" class="ko small"><tspan x="240">수정 후 다시 검토</tspan></text>
</svg>
