<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">업무 규칙을 제약조건과 테스트로 검증하기</title>
  <desc id="desc">확인된 업무 규칙을 데이터베이스 제약조건으로 선택하고 정상 입력과 오류 입력을 테스트한 뒤 결과와 메타데이터를 확인해 검증 완료 또는 요구사항과 DDL 수정으로 판단하는 직각 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"NanumSquare","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","UnDotum",Arial,sans-serif;fill:#1f2937}
      .mono{font-family:"Noto Sans Mono CJK KR","NanumSquare",Consolas,D2Coding,"Courier New",monospace}
      .title{font-size:28px;font-weight:700;text-anchor:middle}
      .subtitle{font-size:14px;fill:#4b5563;text-anchor:middle}
      .head{font-size:17px;font-weight:700;text-anchor:middle}
      .body{font-size:13.5px;text-anchor:middle;fill:#334155}
      .small{font-size:12px;text-anchor:middle;fill:#475569}
      .step{font-size:12px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .label{font-size:12px;font-weight:700;text-anchor:middle}
      .yes{fill:#15803d}
      .no{fill:#b45309}
      .box{stroke-width:1.8;rx:14;ry:14}
      .rule{fill:#eaf3ff;stroke:#2563eb}
      .select{fill:#fff6d8;stroke:#ca8a04}
      .test{fill:#f3edff;stroke:#8b5cf6}
      .evidence{fill:#eaf8ee;stroke:#16a34a}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:16;ry:16}
      .mapping{fill:#ffffff;stroke:#94a3b8}
      .constraint{fill:#f3edff;stroke:#8b5cf6}
      .negative{fill:#ffeaea;stroke:#dc2626}
      .decision{fill:#ffffff;stroke:#2563eb}
      .success{fill:#eaf8ee;stroke:#16a34a}
      .revise{fill:#fff7ed;stroke:#f97316}
      .line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#475569;stroke-width:2;fill:none;stroke-linejoin:round}
      .divider{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1200" height="840" fill="#ffffff"/>
  <text x="600" y="45" class="title">업무 규칙을 제약조건과 테스트로 검증하기</text>
  <text x="600" y="72" class="subtitle">제약조건은 확인된 요구사항을 구현하고 정상·오류 입력으로 검증할 때 안전장치가 됩니다.</text>

  <!-- Horizontal workflow -->
  <rect x="45" y="110" width="245" height="90" class="box rule"/>
  <circle cx="75" cy="139" r="15" fill="#2563eb"/>
  <text x="75" y="144" class="step">1</text>
  <text x="167" y="145" class="head">업무 규칙 확인</text>
  <text x="167" y="174" class="body">정책과 예외를 먼저 확정</text>

  <rect x="335" y="110" width="245" height="90" class="box select"/>
  <circle cx="365" cy="139" r="15" fill="#ca8a04"/>
  <text x="365" y="144" class="step">2</text>
  <text x="457" y="145" class="head">제약조건 선택</text>
  <text x="457" y="174" class="body">PK·FK·NOT NULL·UNIQUE·CHECK</text>

  <rect x="625" y="110" width="245" height="90" class="box test"/>
  <circle cx="655" cy="139" r="15" fill="#8b5cf6"/>
  <text x="655" y="144" class="step">3</text>
  <text x="747" y="145" class="head">정상·오류 입력 테스트</text>
  <text x="747" y="174" class="body">통과와 차단을 함께 확인</text>

  <rect x="915" y="110" width="240" height="90" class="box evidence"/>
  <circle cx="945" cy="139" r="15" fill="#16a34a"/>
  <text x="945" y="144" class="step">4</text>
  <text x="1035" y="145" class="head">결과·메타데이터 확인</text>
  <text x="1035" y="174" class="body">정의와 실행 증거 기록</text>

  <path d="M290 155 H335" class="line"/>
  <path d="M580 155 H625" class="line"/>
  <path d="M870 155 H915" class="line"/>

  <!-- Mapping table -->
  <text x="600" y="242" class="head">제약조건 매핑과 정상·오류 테스트 예시</text>
  <line x1="45" y1="260" x2="1155" y2="260" class="divider"/>

  <rect x="35" y="280" width="210" height="285" class="group"/>
  <rect x="55" y="300" width="170" height="58" class="box mapping"/>
  <text x="140" y="325" class="head">행 식별</text>
  <text x="140" y="347" class="small">각 행을 유일하게 구분</text>
  <rect x="55" y="378" width="170" height="55" class="box constraint"/>
  <text x="140" y="412" class="head mono">PRIMARY KEY</text>
  <rect x="55" y="453" width="170" height="92" class="box negative"/>
  <text x="140" y="480" class="body">정상: 새로운 ID</text>
  <text x="140" y="507" class="body">오류: 중복 PK</text>
  <text x="140" y="531" class="small">정상 통과 · 중복 차단</text>

  <rect x="265" y="280" width="210" height="285" class="group"/>
  <rect x="285" y="300" width="170" height="58" class="box mapping"/>
  <text x="370" y="325" class="head">대상 참조</text>
  <text x="370" y="347" class="small">존재하는 부모 행 연결</text>
  <rect x="285" y="378" width="170" height="55" class="box constraint"/>
  <text x="370" y="412" class="head mono">FOREIGN KEY</text>
  <rect x="285" y="453" width="170" height="92" class="box negative"/>
  <text x="370" y="480" class="body">정상: 존재하는 학생</text>
  <text x="370" y="507" class="body">오류: 없는 학생</text>
  <text x="370" y="531" class="small">정상 참조 · 고아 차단</text>

  <rect x="495" y="280" width="210" height="285" class="group"/>
  <rect x="515" y="300" width="170" height="58" class="box mapping"/>
  <text x="600" y="325" class="head">필수값</text>
  <text x="600" y="347" class="small">반드시 입력해야 하는 값</text>
  <rect x="515" y="378" width="170" height="55" class="box constraint"/>
  <text x="600" y="412" class="head mono">NOT NULL</text>
  <rect x="515" y="453" width="170" height="92" class="box negative"/>
  <text x="600" y="480" class="body">정상: 값 입력</text>
  <text x="600" y="507" class="body">오류: NULL 입력</text>
  <text x="600" y="531" class="small">값 통과 · NULL 차단</text>

  <rect x="725" y="280" width="210" height="285" class="group"/>
  <rect x="745" y="300" width="170" height="58" class="box mapping"/>
  <text x="830" y="325" class="head">중복 금지</text>
  <text x="830" y="347" class="small">업무 식별자의 유일성</text>
  <rect x="745" y="378" width="170" height="55" class="box constraint"/>
  <text x="830" y="412" class="head mono">UNIQUE</text>
  <rect x="745" y="453" width="170" height="92" class="box negative"/>
  <text x="830" y="480" class="body">정상: 새 이메일</text>
  <text x="830" y="507" class="body">오류: 중복 이메일</text>
  <text x="830" y="531" class="small">신규 통과 · 중복 차단</text>

  <rect x="955" y="280" width="210" height="285" class="group"/>
  <rect x="975" y="300" width="170" height="58" class="box mapping"/>
  <text x="1060" y="325" class="head">값 범위·상태</text>
  <text x="1060" y="347" class="small">허용된 값만 저장</text>
  <rect x="975" y="378" width="170" height="55" class="box constraint"/>
  <text x="1060" y="412" class="head mono">CHECK</text>
  <rect x="975" y="453" width="170" height="92" class="box negative"/>
  <text x="1060" y="480" class="body">정상: 허용 값</text>
  <text x="1060" y="507" class="body">오류: 음수·잘못된 상태</text>
  <text x="1060" y="531" class="small">허용 통과 · 위반 차단</text>

  <!-- Decision and outcomes -->
  <rect x="270" y="610" width="660" height="82" class="box decision"/>
  <text x="600" y="642" class="head">정상 입력은 통과하고 오류 입력은</text>
  <text x="600" y="669" class="head">의도한 제약조건으로 차단되는가?</text>

  <path d="M600 692 V715" class="connector"/>
  <path d="M600 715 H275 V735" class="line"/>
  <path d="M600 715 H925 V735" class="line"/>
  <text x="420" y="708" class="label no">아니요</text>
  <text x="780" y="708" class="label yes">예</text>

  <rect x="60" y="735" width="430" height="72" class="box revise"/>
  <text x="275" y="764" class="head">요구사항·DDL 수정</text>
  <text x="275" y="791" class="body">같은 정상·오류 테스트를 다시 실행</text>

  <rect x="710" y="735" width="430" height="72" class="box success"/>
  <text x="925" y="764" class="head">검증 완료</text>
  <text x="925" y="791" class="body">제약조건 정의·테스트 결과·메타데이터 기록</text>

  <text x="600" y="828" class="small">핵심: 제약조건 이름만 확인하지 말고 정상 입력의 통과와 오류 입력의 차단을 모두 실행 증거로 남깁니다.</text>
</svg>
