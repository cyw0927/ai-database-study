<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">요구사항부터 분석 결과까지 검증하기</title>
  <desc id="desc">요구사항, ERD, DDL, 데이터베이스 검증, 분석 VIEW와 Python 결과를 비교하고 불일치 시 최초 지점으로 돌아가는 흐름</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><style>
  text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#111827}.t{font-size:29px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{stroke-width:2;rx:13;ry:13}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.p{fill:#faf5ff;stroke:#8b5cf6}.y{fill:#fffbeb;stroke:#f59e0b}.c{fill:#ecfeff;stroke:#06b6d4}.r{fill:#fff1f2;stroke:#f43f5e}.head{font-size:15px;font-weight:700;text-anchor:middle}.body{font-size:12px;text-anchor:middle;fill:#334155}.line{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.retry{stroke:#dc2626;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.tag{font-size:12px;font-weight:700;fill:#475569}
  </style></defs>
