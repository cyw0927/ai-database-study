<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">설계 결정과 분석·검증 근거를 설명하는 흐름</title>
  <desc id="desc">문제와 범위, 설계, PostgreSQL 구현, SQL 분석, Python 분석, 운영과 AI 검토, 한계와 다음 버전을 최종 보고서로 연결하는 흐름</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#be123c"/></marker><style>
  text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#111827}.t{font-size:29px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{stroke-width:2;rx:13;ry:13}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.p{fill:#faf5ff;stroke:#8b5cf6}.y{fill:#fffbeb;stroke:#f59e0b}.c{fill:#ecfeff;stroke:#06b6d4}.r{fill:#fff1f2;stroke:#f43f5e}.n{fill:#f8fafc;stroke:#64748b}.head{font-size:15px;font-weight:700;text-anchor:middle}.body{font-size:12px;text-anchor:middle;fill:#334155}.line{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.back{stroke:#be123c;stroke-width:2.2;fill:none;marker-end:url(#retry)}.tag{font-size:12px;font-weight:700;fill:#475569}
  </style></defs>
  <rect width="1200" height="840" fill="#fff"/>
  <text x="600" y="46" class="t">설계 결정과 분석·검증 근거를 설명하는 흐름</text>
  <text x="600" y="76" class="s">최종 보고서는 선택, 구현, 검증, 분석과 남은 한계를 하나의 이야기로 연결합니다.</text>

  <rect x="30" y="140" width="165" height="105" class="card b"/><text x="112" y="174" class="head">1. 문제·사용자</text><text x="112" y="204" class="body">해결할 핵심 업무</text>
  <rect x="220" y="140" width="165" height="105" class="card b"/><text x="302" y="174" class="head">2. 범위</text><text x="302" y="201" class="body">필수·제외·선택</text><text x="302" y="222" class="body">미확정 정책</text>
  <rect x="410" y="140" width="165" height="105" class="card g"/><text x="492" y="174" class="head">3. 설계 결정</text><text x="492" y="201" class="body">ERD·키·무결성</text><text x="492" y="222" class="body">대안과 선택 근거</text>
  <rect x="600" y="140" width="165" height="105" class="card p"/><text x="682" y="174" class="head">4. DB 구현</text><text x="682" y="201" class="body">DDL·seed·검증 SQL</text><text x="682" y="222" class="body">재현 가능한 실행</text>
  <rect x="790" y="140" width="165" height="105" class="card y"/><text x="872" y="174" class="head">5. DB 검증</text><text x="872" y="201" class="body">정상·경계·반례</text><text x="872" y="222" class="body">트랜잭션·성능</text>
  <rect x="980" y="140" width="165" height="105" class="card c"/><text x="1062" y="174" class="head">6. SQL 분석</text><text x="1062" y="201" class="body">분석 VIEW·기준값</text><text x="1062" y="222" class="body">질문 1건 단위</text>
  <path d="M195 192 H220" class="line"/><path d="M385 192 H410" class="line"/><path d="M575 192 H600" class="line"/><path d="M765 192 H790" class="line"/><path d="M955 192 H980" class="line"/>
  <path d="M1062 245 V325" class="line"/>

  <rect x="980" y="325" width="165" height="105" class="card c"/><text x="1062" y="359" class="head">7. Python 분석</text><text x="1062" y="389" class="body">pandas 집계·검증</text>
  <rect x="790" y="325" width="165" height="105" class="card y"/><text x="872" y="359" class="head">8. 결과 비교</text><text x="872" y="386" class="body">SQL ↔ Python</text><text x="872" y="407" class="body">행 수·건수·합계</text>
  <polygon points="650,305 760,377 650,449 540,377" class="card y"/><text x="650" y="365" class="head">기준과 일치?</text><text x="650" y="395" class="body">요구사항·예상값</text>
  <rect x="350" y="325" width="165" height="105" class="card r"/><text x="432" y="359" class="head">9. AI·사람 수정</text><text x="432" y="386" class="body">diff·재실행·승인</text><text x="432" y="407" class="body">설계·SQL·Python</text>
  <path d="M980 377 H955" class="line"/><path d="M790 377 H760" class="line"/>
  <path d="M540 377 H515" class="back"/><text x="522" y="360" class="tag">아니요</text>
  <path d="M432 325 V285 H492 V245" class="back"/>

  <rect x="70" y="555" width="220" height="105" class="card r"/><text x="180" y="589" class="head">10. 운영 판단</text><text x="180" y="616" class="body">권한·보안·백업</text><text x="180" y="637" class="body">복구·RPO·RTO</text>
  <rect x="350" y="555" width="220" height="105" class="card n"/><text x="460" y="589" class="head">11. 현재 한계</text><text x="460" y="616" class="body">미실행·미확정 항목</text><text x="460" y="637" class="body">해석 제한·남은 위험</text>
  <rect x="630" y="555" width="220" height="105" class="card b"/><text x="740" y="589" class="head">12. 다음 버전</text><text x="740" y="616" class="body">웹·NoSQL·배포</text><text x="740" y="637" class="body">우선순위·조건</text>
  <rect x="910" y="555" width="220" height="105" class="card g"/><text x="1020" y="589" class="head">13. 최종 판단</text><text x="1020" y="616" class="body">final_report.md</text><text x="1020" y="637" class="body">완료·조건부·보류</text>
  <path d="M610 449 V500 H180 V555" class="line"/><text x="575" y="492" class="tag">예</text>
  <path d="M290 607 H350" class="line"/><path d="M570 607 H630" class="line"/><path d="M850 607 H910" class="line"/>

  <rect x="180" y="720" width="840" height="55" class="card p"/><text x="600" y="754" class="head">보고서에는 문제부터 최종 판단까지의 근거와 상태를 빠짐없이 기록합니다.</text>
</svg>
