<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">필수 범위와 선택 확장 결정하기</title>
  <desc id="desc">필수 데이터베이스 설계와 SQL·Python 분석을 완료한 뒤 실제 요구사항에 따라 웹, NoSQL 또는 배포를 선택하는 흐름</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><style>
  text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#111827}.t{font-size:29px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{stroke-width:2;rx:14;ry:14}.b{fill:#eff6ff;stroke:#3b82f6}.c{fill:#ecfeff;stroke:#06b6d4}.g{fill:#f0fdf4;stroke:#22c55e}.y{fill:#fffbeb;stroke:#f59e0b}.r{fill:#fff1f2;stroke:#f43f5e}.p{fill:#faf5ff;stroke:#8b5cf6}.n{fill:#f8fafc;stroke:#64748b}.head{font-size:18px;font-weight:700;text-anchor:middle}.body{font-size:13px;text-anchor:middle;fill:#334155}.small{font-size:12px;text-anchor:middle;fill:#475569}.line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.bus{stroke:#94a3b8;stroke-width:2;fill:none}.retry{stroke:#dc2626;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.tag{font-size:12px;font-weight:700;fill:#475569}
  </style></defs>
  <rect width="1200" height="780" fill="#fff"/>
  <text x="600" y="46" class="t">필수 범위와 선택 확장 결정하기</text>
  <text x="600" y="76" class="s">SQL·Python 분석까지 필수로 완료한 뒤 필요한 기술만 선택합니다.</text>

  <rect x="50" y="145" width="280" height="180" class="card b"/>
  <text x="190" y="180" class="head">필수 DB 설계·검증</text>
  <text x="190" y="215" class="body">requirements · ERD · DDL</text>
  <text x="190" y="243" class="body">seed · 조회 · 반례 · 트랜잭션</text>
  <text x="190" y="271" class="body">인덱스 · 보안 · 백업 · 복구</text>
  <text x="190" y="301" class="small">01~08 실행</text>

  <rect x="390" y="145" width="280" height="180" class="card c"/>
  <text x="530" y="180" class="head">필수 SQL·Python 분석</text>
  <text x="530" y="215" class="body">09_analysis_dataset.sql</text>
  <text x="530" y="243" class="body">pandas 상태·월·학생별 집계</text>
  <text x="530" y="271" class="body">SQL 기준값과 교차 검증</text>
  <text x="530" y="301" class="small">분석 보고서 작성</text>

  <polygon points="850,135 1010,235 850,335 690,235" class="card y"/>
  <text x="850" y="213" class="head">필수 완료 기준을</text>
  <text x="850" y="240" class="head">통과했는가?</text>
  <text x="850" y="272" class="small">10_completion_gate.sql</text>

  <path d="M330 235 H390" class="line"/>
  <path d="M670 235 H690" class="line"/>

  <rect x="70" y="400" width="300" height="100" class="card r"/>
  <text x="220" y="435" class="head">필수 항목 보완</text>
  <text x="220" y="465" class="body">SQL·Python 재실행 · 재검증</text>
  <path d="M850 335 V370 H220 V400" class="retry"/>
  <text x="720" y="362" class="tag">아니요</text>
  <path d="M70 450 H30 V235 H50" class="retry"/>

  <rect x="740" y="400" width="300" height="100" class="card g"/>
  <text x="890" y="435" class="head">선택 확장 필요성 판단</text>
  <text x="890" y="465" class="body">실제 문제와 조회 패턴 기준</text>
  <path d="M850 335 V370 H890 V400" class="line"/>
  <text x="870" y="362" class="tag">예</text>

  <path d="M890 500 V550" class="line"/>
  <path d="M250 550 H950" class="bus"/>
  <rect x="120" y="590" width="260" height="100" class="card b"/><text x="250" y="625" class="head">웹 CRUD/API</text><text x="250" y="655" class="body">입력·조회 흐름 검증</text>
  <rect x="470" y="590" width="260" height="100" class="card p"/><text x="600" y="625" class="head">NoSQL</text><text x="600" y="655" class="body">별도 문서·이벤트 패턴</text>
  <rect x="820" y="590" width="260" height="100" class="card n"/><text x="950" y="625" class="head">배포</text><text x="950" y="655" class="body">외부 접근·운영 검증</text>
  <path d="M250 550 V590" class="line"/><path d="M600 550 V590" class="line"/><path d="M950 550 V590" class="line"/>

  <rect x="430" y="715" width="340" height="45" class="card g"/>
  <text x="600" y="743" class="head">필수 프로젝트 완료 상태 유지</text>
  <path d="M1040 450 H1130 V737 H770" class="line"/>
  <text x="1070" y="438" class="tag">불필요</text>
</svg>
